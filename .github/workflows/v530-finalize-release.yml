name: Finalize SleepMate 5.3.0 release

on:
  push:
    branches:
      - v5.3.0-o2ring-aurora-pwa

permissions:
  actions: write
  contents: write

concurrency:
  group: sleepmate-v530-finalize
  cancel-in-progress: true

jobs:
  publish-immutable-v530:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and verify immutable release target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v5.3.0'
          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          RELEASE_SHA="$(printf '%s' "$tag_json" | jq -r '.object.sha')"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor d1516fb39a67d4666504c885fe1ab80f5b89022e "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(git show "$RELEASE_SHA:cpap/version.py" | grep -F 'APP_VERSION = "5.3.0"' | wc -l)" -eq 1
          test "$(git show "$RELEASE_SHA:RELEASE_NOTES.md" | head -n 1)" = '# SleepMate 5.3.0'
          git show "$RELEASE_SHA:THIRD_PARTY_NOTICES.md" | grep -Fq 'Reference release: `v5.3.0`'
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "Immutable release target: $TAG -> $RELEASE_SHA"

      - name: Require successful exact-SHA O2/PWA pre-release verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")"
          row="$(printf '%s' "$runs" | jq -c '[.workflow_runs[] | select(.name == "v5.3 O2Ring Aurora PWA pre-release CI" and .event == "push" and .head_sha == env.RELEASE_SHA and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty')"
          [[ -n "$row" ]] || { echo "No successful exact-SHA v5.3 pre-release verification exists for $RELEASE_SHA." >&2; exit 1; }
          echo "Using pre-release verification run $(printf '%s' "$row" | jq -r '.id')."

      - name: Dispatch official Windows release pipeline on v5.3.0 tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")"
          row="$(printf '%s' "$existing" | jq -c '[.workflow_runs[] | select(.name == "Windows release + Hungarian MSI + verified publish" and .event == "workflow_dispatch" and .head_sha == env.RELEASE_SHA)] | sort_by(.created_at) | last // empty')"
          if [[ -n "$row" ]]; then
            echo "Official release workflow already exists: $(printf '%s' "$row" | jq -r '.id')."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release.yml/dispatches" -f ref='v5.3.0'
            echo 'Official Windows release workflow dispatched for v5.3.0.'
          fi

      - name: Wait for official Windows VERIFIED release set
        id: official
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")"
            row="$(printf '%s' "$runs" | jq -c '[.workflow_runs[] | select(.name == "Windows release + Hungarian MSI + verified publish" and .event == "workflow_dispatch" and .head_sha == env.RELEASE_SHA)] | sort_by(.created_at) | last // empty')"
            if [[ -n "$row" ]]; then
              run_id="$(printf '%s' "$row" | jq -r '.id')"
              status="$(printf '%s' "$row" | jq -r '.status')"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              echo "Official release run $run_id: status=$status conclusion=$conclusion"
              if [[ "$status" == 'completed' ]]; then
                [[ "$conclusion" == 'success' ]] || { echo 'Official Windows release verification failed.' >&2; exit 1; }
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for the official Windows release verification.' >&2
          exit 1

      - name: Download VERIFIED release artifact only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.official.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir release-staging
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name 'SleepMate-Windows-x64-VERIFIED-RELEASE' --dir release-staging
          test -s release-staging/SHA256SUMS.txt
          (
            cd release-staging
            sha256sum -c SHA256SUMS.txt
          )
          test -s release-staging/SleepMate_Setup_v5.3.0.msi
          test -s release-staging/SleepMate_v5.3.0_windows_x64.zip
          test -s release-staging/sleepmate-update.json
          test -s release-staging/release-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('release-staging/sleepmate-update.json').read_text(encoding='utf-8'))
          metadata = json.loads(Path('release-staging/release-metadata.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '5.3.0', manifest
          assert manifest['git_commit'] == os.environ['RELEASE_SHA'], manifest
          assert metadata['version'] == '5.3.0', metadata
          assert metadata['git_commit'] == os.environ['RELEASE_SHA'], metadata
          PY

      - name: Build final release notes from tagged source
        shell: bash
        run: |
          set -euo pipefail
          git show "$RELEASE_SHA:RELEASE_NOTES.md" > /tmp/RELEASE_NOTES.tagged.md
          export RELEASE_SHA
          python - <<'PY'
          import os
          from pathlib import Path
          version = '5.3.0'
          text = Path('/tmp/RELEASE_NOTES.tagged.md').read_text(encoding='utf-8')
          marker = f'# SleepMate {version}'
          if marker not in text:
              raise SystemExit(f'Missing {marker} section.')
          section = text.split(marker, 1)[1].split('\n---\n', 1)[0].strip()
          notes = f'''# SleepMate {version}\n\n{section}\n\n---\n\n## Kiadás ellenőrzése\n\nEz a kiadás kizárólag a hivatalos Windows release workflow **VERIFIED** artifactjából készült. A publikálás előtt lefutott a teljes publikus tesztkészlet, a PyInstaller Windows build, a WiX 3.14.1 magyar MSI build és payload-ellenőrzés, a valódi `msiexec` telepítés, a telepített backend/API ellenőrzése, az eltávolítás és a felhasználói állapot megőrzésének vizsgálata, majd a ZIP/manifeszt/MSI teljes SHA-256 integritásellenőrzése.\n\n**Aláírási státusz:** a kiadás jelenleg nincs Authenticode-dal aláírva; Windows SmartScreen vagy vírusvédelmi reputációs figyelmeztetést jeleníthet meg.\n\n**Fontos:** a SleepMate nem orvosi diagnosztikai szoftver és nem helyettesíti az orvosi értékelést.\n\nVerified commit: `{os.environ['RELEASE_SHA']}`\n'''
          Path('release-notes.generated.md').write_text(notes, encoding='utf-8')
          PY

      - name: Publish final GitHub Release from VERIFIED artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v5.3.0'
          TITLE='SleepMate 5.3.0 — O2Ring + Aurora + Windows MSI'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)"
            [[ "$(printf '%s' "$current" | jq -r '.isDraft')" == 'true' ]] || {
              echo 'A published v5.3.0 release already exists; refusing to overwrite it.' >&2
              exit 1
            }
            [[ "$(printf '%s' "$current" | jq -r '.targetCommitish')" == "$RELEASE_SHA" ]]
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$TITLE" --notes-file release-notes.generated.md --draft
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release-notes.generated.md
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release-staging/* --clobber
          (
            cd release-staging
            sha256sum -c SHA256SUMS.txt
          )
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false

      - name: Final public release verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v5.3.0'
          TITLE='SleepMate 5.3.0 — O2Ring + Aurora + Windows MSI'
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,name,assets,url)"
          [[ "$(printf '%s' "$release" | jq -r '.isDraft')" == 'false' ]]
          [[ "$(printf '%s' "$release" | jq -r '.isPrerelease')" == 'false' ]]
          [[ "$(printf '%s' "$release" | jq -r '.targetCommitish')" == "$RELEASE_SHA" ]]
          [[ "$(printf '%s' "$release" | jq -r '.name')" == "$TITLE" ]]
          names="$(printf '%s' "$release" | jq -r '.assets[].name')"
          grep -Fxq 'SleepMate_Setup_v5.3.0.msi' <<<"$names"
          grep -Fxq 'SleepMate_v5.3.0_windows_x64.zip' <<<"$names"
          grep -Fxq 'sleepmate-update.json' <<<"$names"
          grep -Fxq 'SHA256SUMS.txt' <<<"$names"
          grep -Fxq 'release-metadata.json' <<<"$names"
          echo "$release" | jq .
