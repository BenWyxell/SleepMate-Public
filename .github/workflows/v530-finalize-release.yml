name: Finalize SleepMate 5.3.0 release

# v5.3.0 is already published and its tag is immutable. Keep the historical
# finalizer in the published tag; post-release development must never retarget
# or overwrite that release automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-release-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm v5.3.0 is already public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v5.3.0")"
          test "$(printf '%s' "$release" | jq -r '.draft')" = 'false'
          test "$(printf '%s' "$release" | jq -r '.prerelease')" = 'false'
          echo 'SleepMate v5.3.0 is already published. This workflow intentionally performs no mutation.'