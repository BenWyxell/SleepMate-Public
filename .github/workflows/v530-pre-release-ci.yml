name: v5.3 O2Ring Aurora PWA pre-release CI

on:
  push:
    branches: [v5.3.0-o2ring-aurora-pwa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleepmate-v530-pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Verify v5.2.20 ancestry and source syntax
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor d1516fb39a67d4666504c885fe1ab80f5b89022e HEAD
          if($LASTEXITCODE -ne 0){throw 'Candidate is not descended from public v5.2.20.'}
          python .\scripts\verify_public_source.py
          if($LASTEXITCODE -ne 0){throw 'Public source gate failed.'}
          python -m py_compile .\app.py .\sleepmate_main.py .\cpap\o2ring_ble.py .\cpap\o2ring_integration.py .\cpap\o2ring_data_management.py .\cpap\o2ring_vld.py .\cpap\oximetry.py .\cpap\o2ring_device_config.py .\cpap\o2ring_stream.py .\cpap\o2ring_report.py .\cpap\ui_preferences_v530.py .\cpap\v530_features.py
          if($LASTEXITCODE -ne 0){throw 'Python syntax gate failed.'}
          foreach($js in @('.\web\app.js','.\web\app-core.js','.\web\sleepmate-v530.js','.\web\o2ring.js','.\web\o2ring-combined.js','.\web\o2ring-data-management.js','.\web\o2ring-report-ui.js','.\web\service-worker-v508-base.js')){
            node --check $js
            if($LASTEXITCODE -ne 0){throw "JavaScript syntax gate failed: $js"}
          }
      - name: Run all tests and build Windows program tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          .\build\windows\build_release.ps1
          if($LASTEXITCODE -ne 0){throw "Program-tree build failed: $LASTEXITCODE"}
      - name: Verify responsive PWA and O2 feature shell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $generated='build\windows\web-generated'
          foreach($name in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css','o2ring.js','o2ring.css','o2ring-combined.js','o2ring-data-management.js','o2ring-report-ui.js')){
            if(-not(Test-Path (Join-Path $generated $name))){throw "Generated asset missing: $name"}
          }
          $sw=Get-Content (Join-Path $generated 'service-worker.js') -Raw
          foreach($needle in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css','o2ring.js','o2ring.css','o2ring-report-ui.js')){
            if($sw -notmatch [regex]::Escape($needle)){throw "Service-worker cache contract missing: $needle"}
          }
          $controller=Get-Content '.\web\sleepmate-v530.js' -Raw
          foreach($needle in @('pwa_bottom_nav_max','--sm-mobile-items','availableNavIds','oximetry')){
            if($controller -notmatch [regex]::Escape($needle)){throw "Dynamic PWA navigation contract missing: $needle"}
          }
          $css=Get-Content '.\web\sleepmate-v530.css' -Raw
          if($css -notmatch 'env\(safe-area-inset-bottom\)'){throw 'Safe-area bottom support missing.'}
          if($css -notmatch '--sm-mobile-items'){throw 'Dynamic bottom-nav grid variable missing.'}
          if($css -notmatch '@media\s*\(\s*max-width\s*:\s*900px\s*\)'){throw '900px responsive breakpoint missing.'}
          if($css -notmatch '@media\s*\(\s*max-width\s*:\s*520px\s*\)'){throw '520px responsive breakpoint missing.'}
          $shell=Get-Content '.\cpap\v530_features.py' -Raw
          if($shell -notmatch 'sm-o2-master-visibility' -or $shell -notmatch 'smO2Enabled:not\(:checked\)'){throw 'O2 master-off visibility guard missing.'}
          if($shell -notmatch 'o2ring-combined\.js' -or $shell -notmatch 'sm-o2-combined-inline'){throw 'Combined CPAP/O2 inline shell contract missing.'}
          if($shell -notmatch 'o2ring-data-management\.js' -or $shell -notmatch 'sm-o2-data-management-inline' -or $shell -notmatch 'install_o2ring_data_management'){throw 'O2 data-management shell contract missing.'}
          $combined=Get-Content '.\web\o2ring-combined.js' -Raw
          foreach($needle in @('o2rCombinedTimeline','o2rCombinedCpap','o2rCombinedSpo2','o2rCombinedHr','/api/o2ring/day','pointermove')){
            if($combined -notmatch [regex]::Escape($needle)){throw "Combined CPAP/O2 contract missing: $needle"}
          }
          $dataUi=Get-Content '.\web\o2ring-data-management.js' -Raw
          foreach($needle in @('o2rDataManagement','/api/o2ring/delete-data','DELETE_OXIMETRY','SleepMateO2Ring?.refresh','SleepMateO2Combined?.refresh')){
            if($dataUi -notmatch [regex]::Escape($needle)){throw "O2 data-management UI contract missing: $needle"}
          }
          $reportUi=Get-Content '.\web\o2ring-report-ui.js' -Raw
          if($reportUi -notmatch "dataset\.o2ringFeature='1'" -or $reportUi -notmatch 'function uninstall'){throw 'Removable O2 PDF option contract missing.'}
      - name: Upload program tree
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-PROGRAM-TREE
          path: |
            dist/SleepMate/**
            release/SleepMate_v5.3.0_windows_x64.zip
            release/sleepmate-update.json
          if-no-files-found: error
          retention-days: 2

  build-msi:
    needs: build-windows-x64
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned WiX Toolset 3.14
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          choco install wixtoolset --version 3.14.1.20250415 --yes --no-progress
          if($LASTEXITCODE -ne 0){throw "WiX installation failed: $LASTEXITCODE"}
          $wixRoot=Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*'|Sort-Object Name -Descending|Select-Object -First 1
          if(-not $wixRoot){throw 'WiX Toolset directory not found.'}
          $candle=Join-Path $wixRoot.FullName 'bin\candle.exe'
          $light=Join-Path $wixRoot.FullName 'bin\light.exe'
          if(-not(Test-Path $candle) -or -not(Test-Path $light)){throw 'WiX candle/light missing.'}
          "WIX_CANDLE=$candle"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_LIGHT=$light"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download program tree
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-v530-PROGRAM-TREE
          path: ci-input
      - name: Generate and build Hungarian MSI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(& python -c "from cpap.version import APP_VERSION;print(APP_VERSION)").Trim()
          if($version -ne '5.3.0'){throw "Unexpected version: $version"}
          if(-not(Test-Path 'ci-input\dist\SleepMate\SleepMate.exe')){throw 'Program tree missing SleepMate.exe.'}
          New-Item -ItemType Directory -Force -Path 'build\windows\msi','release'|Out-Null
          python .\scripts\generate_msi_wxs.py --source-dir .\ci-input\dist\SleepMate --output .\build\windows\msi\SleepMate.generated.wxs --version $version
          if($LASTEXITCODE -ne 0){throw 'MSI source generation failed.'}
          $obj='build\windows\msi\SleepMate.generated.wixobj'
          $msi="release\SleepMate_Setup_v${version}.msi"
          & $env:WIX_CANDLE -nologo -arch x64 -out $obj 'build\windows\msi\SleepMate.generated.wxs'
          if($LASTEXITCODE -ne 0){throw "candle failed: $LASTEXITCODE"}
          & $env:WIX_LIGHT -nologo -ext WixUIExtension -cultures:hu-HU -loc 'build\windows\msi\SleepMate.hu-HU.wxl' -out $msi $obj
          if($LASTEXITCODE -ne 0){throw "light failed: $LASTEXITCODE"}
          if(-not(Test-Path $msi)){throw 'MSI output missing.'}
          $hash=(Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)"|Set-Content "${msi}.sha256" -Encoding ascii
      - name: Inspect MSI payload by administrative extraction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $msi=(Resolve-Path 'release\SleepMate_Setup_v5.3.0.msi').Path
          $extract=Join-Path $env:RUNNER_TEMP 'SleepMate-v530-MSI-Administrative'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract|Out-Null
          $p=Start-Process msiexec.exe -ArgumentList @('/a',"`"$msi`"",'/qn','/norestart',"TARGETDIR=`"$extract`"") -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){throw "MSI administrative extraction failed: $($p.ExitCode)"}
          foreach($name in @('SleepMate.exe','SleepMateUpdater.exe','SleepMate.ico')){
            if(-not(Get-ChildItem $extract -File -Recurse -Filter $name|Select-Object -First 1)){throw "$name missing from MSI payload."}
          }
          Get-ChildItem $extract -File -Recurse|Sort-Object FullName|ForEach-Object FullName|Set-Content 'release\msi-inventory.txt' -Encoding utf8
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-MSI-UNSIGNED-CI
          path: |
            release/SleepMate_Setup_v5.3.0.msi
            release/SleepMate_Setup_v5.3.0.msi.sha256
            release/msi-inventory.txt
            build/windows/msi/SleepMate.generated.wxs
          if-no-files-found: error
          retention-days: 2

  smoke-test-msi:
    needs: [build-windows-x64, build-msi]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-v530-MSI-UNSIGNED-CI
          path: ci-msi
      - name: Install, boot, verify feature contracts and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $msi=(Get-ChildItem ci-msi -Filter 'SleepMate_Setup_v5.3.0.msi' -File -Recurse|Select-Object -First 1).FullName
          if(-not $msi){throw 'MSI missing.'}
          $installDir=Join-Path $env:LOCALAPPDATA 'Programs\SleepMate-v530-CI'
          $stateDir=Join-Path $env:RUNNER_TEMP 'SleepMate-v530-State'
          $installLog=Join-Path $env:RUNNER_TEMP 'SleepMate-v530-Install.log'
          $uninstallLog=Join-Path $env:RUNNER_TEMP 'SleepMate-v530-Uninstall.log'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stateDir -Recurse -Force -ErrorAction SilentlyContinue
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart',"INSTALLFOLDER=`"$installDir`"",'DESKTOP_SHORTCUT=0','START_WITH_WINDOWS=0','/L*v',"`"$installLog`"") -Wait -PassThru
          if($p.ExitCode -notin @(0,3010)){if(Test-Path $installLog){Get-Content $installLog|Select-Object -Last 200|Write-Host};throw "Install failed: $($p.ExitCode)"}
          $exe=Join-Path $installDir 'SleepMate.exe'
          if(-not(Test-Path $exe)){throw 'Installed EXE missing.'}
          if(([string](Get-Item $exe).VersionInfo.ProductVersion).Trim() -ne '5.3.0'){throw 'ProductVersion mismatch.'}
          $env:SLEEPMATE_STATE_DIR=$stateDir
          $port=59896
          $backend=Start-Process $exe -ArgumentList @('--backend','--host','127.0.0.1','--port',"$port",'--no-browser') -PassThru
          try{
            $v=$null
            for($i=0;$i -lt 50;$i++){
              if($backend.HasExited){throw "Backend exited early: $($backend.ExitCode)"}
              try{$v=Invoke-RestMethod "http://127.0.0.1:$port/api/version" -TimeoutSec 2;break}catch{Start-Sleep -Milliseconds 500}
            }
            if(-not $v){throw 'Backend health timeout.'}
            if($v.app -ne 'SleepMate' -or $v.version -ne '5.3.0' -or [int]$v.api -ne 19){throw "Version contract failed: $($v|ConvertTo-Json -Compress)"}
            $o2=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if($o2.feature_enabled -ne $false -or $o2.ble_enabled -ne $false -or $o2.settings.o2ring_ble_enabled -ne $true){throw "Default O2 contract failed: $($o2|ConvertTo-Json -Compress)"}
            $prefs=Invoke-RestMethod "http://127.0.0.1:$port/api/ui/preferences" -TimeoutSec 5
            if([int]$prefs.pwa_bottom_nav_max -ne 6 -or @($prefs.pwa_bottom_nav).Count -ne 5){throw 'PWA defaults failed.'}
            $prefs2=Invoke-RestMethod "http://127.0.0.1:$port/api/ui/preferences" -Method Post -ContentType 'application/json' -Body (@{pwa_bottom_nav=@('dashboard','sessions','charts','ai','reports','more')}|ConvertTo-Json -Compress) -TimeoutSec 5
            if(@($prefs2.pwa_bottom_nav).Count -ne 6 -or $prefs2.pwa_bottom_nav[4] -ne 'reports'){throw 'Six-item PWA menu order failed.'}
            $null=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/settings" -Method Post -ContentType 'application/json' -Body (@{o2ring_enabled=$true;o2ring_ble_enabled=$false;o2ring_auto_connect=$true;o2ring_preferred_address='CI-RING-REMEMBERED'}|ConvertTo-Json -Compress) -TimeoutSec 5
            $on=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if($on.feature_enabled -ne $true -or $on.ble_enabled -ne $false -or $on.settings.o2ring_preferred_address -ne 'CI-RING-REMEMBERED'){throw 'Master-on/BLE-off contract failed.'}

            $deleted=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/delete-data" -Method Post -ContentType 'application/json' -Body (@{confirm='DELETE_OXIMETRY'}|ConvertTo-Json -Compress) -TimeoutSec 5
            if($deleted.ok -ne $true -or [int]$deleted.recordings_remaining -ne 0 -or $deleted.remembered_device_preserved -ne $true){throw "O2 deletion contract failed: $($deleted|ConvertTo-Json -Compress)"}
            $afterDelete=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if($afterDelete.settings.o2ring_preferred_address -ne 'CI-RING-REMEMBERED'){throw 'O2 deletion forgot the remembered ring.'}
            if(-not(Get-ChildItem $stateDir -Recurse -File -Filter 'deleted_sources.json' -ErrorAction SilentlyContinue|Select-Object -First 1)){throw 'O2 deletion tombstone file was not created.'}

            $null=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/settings" -Method Post -ContentType 'application/json' -Body (@{o2ring_enabled=$false}|ConvertTo-Json -Compress) -TimeoutSec 5
            $off=Invoke-RestMethod "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if($off.feature_enabled -ne $false -or $off.settings.o2ring_preferred_address -ne 'CI-RING-REMEMBERED'){throw 'Master-off preservation failed.'}
            $html=(Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5).Content
            foreach($needle in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css','sm-o2-master-visibility','sm-o2-combined-inline','o2rCombinedTimeline','sm-o2-data-management-inline','o2rDataManagement')){if($html -notmatch [regex]::Escape($needle)){throw "Installed shell missing $needle"}}
            if($html -match 'data-page="oximetry"'){throw 'Base HTML hard-codes Oximetria slot.'}
            try{Invoke-RestMethod "http://127.0.0.1:$port/api/system/shutdown" -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 5|Out-Null}catch{}
            if(-not $backend.WaitForExit(10000)){Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue}
          }finally{if(-not $backend.HasExited){Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue}}
          if(-not(Test-Path $stateDir)){throw 'State directory missing.'}
          $u=Start-Process msiexec.exe -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart','/L*v',"`"$uninstallLog`"") -Wait -PassThru
          if($u.ExitCode -notin @(0,3010)){if(Test-Path $uninstallLog){Get-Content $uninstallLog|Select-Object -Last 200|Write-Host};throw "Uninstall failed: $($u.ExitCode)"}
          if(Test-Path $exe){throw 'EXE remained after uninstall.'}
          if(-not(Test-Path $stateDir)){throw 'User state was removed on uninstall.'}
      - name: Upload complete candidate
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-UNSIGNED-CANDIDATE
          path: ci-msi/release/SleepMate_Setup_v5.3.0.msi
          if-no-files-found: error
          retention-days: 2
