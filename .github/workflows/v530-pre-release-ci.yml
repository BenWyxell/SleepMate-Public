name: v5.3 O2Ring Aurora PWA pre-release CI

on:
  push:
    branches:
      - v5.3.0-o2ring-aurora-pwa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sleepmate-v530-pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact v5.3 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Verify v5.2.20 baseline ancestry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor d1516fb39a67d4666504c885fe1ab80f5b89022e HEAD
          if ($LASTEXITCODE -ne 0) { throw 'v5.3 candidate is not descended from the public v5.2.20 release commit.' }

      - name: Verify public source and v5.3 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python .\scripts\verify_public_source.py
          if ($LASTEXITCODE -ne 0) { throw "Public source verification failed: $LASTEXITCODE" }
          python -m py_compile .\app.py .\sleepmate_main.py .\cpap\o2ring_ble.py .\cpap\o2ring_integration.py .\cpap\o2ring_vld.py .\cpap\oximetry.py .\cpap\o2ring_device_config.py .\cpap\o2ring_stream.py .\cpap\o2ring_report.py .\cpap\ui_preferences_v530.py .\cpap\v530_features.py
          if ($LASTEXITCODE -ne 0) { throw "Python syntax validation failed: $LASTEXITCODE" }
          $jsFiles = @(
            '.\web\app.js',
            '.\web\app-core.js',
            '.\web\sleepmate-v530.js',
            '.\web\o2ring.js',
            '.\web\o2ring-report-ui.js',
            '.\web\service-worker-v508-base.js'
          )
          foreach ($js in $jsFiles) {
            node --check $js
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax validation failed for ${js}: $LASTEXITCODE" }
          }

      - name: Build and run complete repository test contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\build\windows\build_release.ps1

      - name: Verify generated PWA bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $generated = 'build\windows\web-generated'
          foreach ($name in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css','o2ring.js','o2ring.css','o2ring-report-ui.js')) {
            if (-not (Test-Path (Join-Path $generated $name))) { throw "Generated PWA asset missing: $name" }
          }
          $sw = Get-Content (Join-Path $generated 'service-worker.js') -Raw
          foreach ($needle in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css','o2ring.js','o2ring.css','o2ring-report-ui.js')) {
            if ($sw -notmatch [regex]::Escape($needle)) { throw "PWA service-worker cache contract missing: $needle" }
          }
          $controller = Get-Content '.\web\sleepmate-v530.js' -Raw
          foreach ($needle in @('pwa_bottom_nav_max','--sm-mobile-items','availableNavIds','oximetry')) {
            if ($controller -notmatch [regex]::Escape($needle)) { throw "Dynamic PWA navigation contract missing: $needle" }
          }
          $css = Get-Content '.\web\sleepmate-v530.css' -Raw
          foreach ($needle in @('env(safe-area-inset-bottom)','--sm-mobile-items','@media (max-width:900px)','@media (max-width:520px)')) {
            if ($css -notmatch [regex]::Escape($needle)) { throw "Responsive PWA CSS contract missing: $needle" }
          }

      - name: Upload program tree for MSI job
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-PROGRAM-TREE
          path: |
            dist/SleepMate/**
            release/SleepMate_v*_windows_x64.zip
            release/sleepmate-update.json
          if-no-files-found: error
          retention-days: 2

  build-msi:
    needs: build-windows-x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact v5.3 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned WiX Toolset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wixtoolset --version 3.14.1.20250415 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WiX Toolset installation failed: $LASTEXITCODE" }
          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixRoot) { throw 'WiX Toolset installation directory was not found.' }
          $candle = Join-Path $wixRoot.FullName 'bin\candle.exe'
          $light = Join-Path $wixRoot.FullName 'bin\light.exe'
          if (-not (Test-Path $candle) -or -not (Test-Path $light)) { throw 'WiX binaries not found.' }
          "WIX_CANDLE=$candle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_LIGHT=$light" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Windows program tree
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-v530-PROGRAM-TREE
          path: ci-input

      - name: Generate and build Hungarian MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          if ($version -ne '5.3.0') { throw "Unexpected v5.3 candidate version: $version" }
          New-Item -ItemType Directory -Force -Path 'build\windows\msi','release' | Out-Null
          python .\scripts\generate_msi_wxs.py --source-dir .\ci-input\dist\SleepMate --output .\build\windows\msi\SleepMate.generated.wxs --version $version
          if ($LASTEXITCODE -ne 0) { throw "MSI source generation failed: $LASTEXITCODE" }
          $wixObj = 'build\windows\msi\SleepMate.generated.wixobj'
          $msi = "release\SleepMate_Setup_v${version}.msi"
          & $env:WIX_CANDLE -nologo -arch x64 -out $wixObj 'build\windows\msi\SleepMate.generated.wxs'
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed: $LASTEXITCODE" }
          & $env:WIX_LIGHT -nologo -ext WixUIExtension -cultures:hu-HU -loc 'build\windows\msi\SleepMate.hu-HU.wxl' -out $msi $wixObj
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed: $LASTEXITCODE" }
          if (-not (Test-Path $msi)) { throw 'MSI output was not created.' }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -Path "${msi}.sha256" -Encoding ascii

      - name: Inspect MSI payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'release\SleepMate_Setup_v5.3.0.msi').Path
          $extract = Join-Path $env:RUNNER_TEMP 'SleepMate-v530-MSI-Administrative'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/a',"`"$msi`"",'/qn','/norestart',"TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($proc.ExitCode -notin @(0,3010)) { throw "MSI administrative extraction failed: $($proc.ExitCode)" }
          foreach ($name in @('SleepMate.exe','SleepMateUpdater.exe','SleepMate.ico','LICENSE','PRIVACY.md','THIRD_PARTY_NOTICES.md')) {
            if (-not (Get-ChildItem $extract -File -Recurse -Filter $name | Select-Object -First 1)) { throw "$name missing from MSI payload." }
          }
          Get-ChildItem $extract -File -Recurse | Sort-Object FullName | ForEach-Object FullName | Set-Content -Path 'release\msi-inventory.txt' -Encoding utf8

      - name: Upload unsigned v5.3 MSI
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-MSI-UNSIGNED-CI
          path: |
            release/SleepMate_Setup_v5.3.0.msi
            release/SleepMate_Setup_v5.3.0.msi.sha256
            release/msi-inventory.txt
            build/windows/msi/SleepMate.generated.wxs
          if-no-files-found: error
          retention-days: 2

  smoke-test-msi:
    needs:
      - build-windows-x64
      - build-msi
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-v530-MSI-UNSIGNED-CI
          path: ci-msi

      - name: Install, boot, verify v5.3 APIs and uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem -Path 'ci-msi' -Filter 'SleepMate_Setup_v5.3.0.msi' -File -Recurse | Select-Object -First 1).FullName
          if (-not $msi) { throw 'v5.3 MSI was not downloaded.' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\SleepMate-v530-CI'
          $stateDir = Join-Path $env:RUNNER_TEMP 'SleepMate-v530-State'
          $installLog = Join-Path $env:RUNNER_TEMP 'SleepMate-v530-Install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'SleepMate-v530-Uninstall.log'
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stateDir -Recurse -Force -ErrorAction SilentlyContinue
          $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/i',"`"$msi`"",'/qn','/norestart',"INSTALLFOLDER=`"$installDir`"",'/L*v',"`"$installLog`"") -Wait -PassThru
          if ($installer.ExitCode -notin @(0,3010)) { if(Test-Path $installLog){Get-Content $installLog|Select-Object -Last 200|Write-Host}; throw "MSI install failed: $($installer.ExitCode)" }
          $exe = Join-Path $installDir 'SleepMate.exe'
          if (-not (Test-Path $exe)) { throw 'Installed SleepMate.exe missing.' }
          if (([string](Get-Item $exe).VersionInfo.ProductVersion).Trim() -ne '5.3.0') { throw 'Installed ProductVersion is not 5.3.0.' }

          $env:SLEEPMATE_STATE_DIR = $stateDir
          $port = 59896
          $backend = Start-Process -FilePath $exe -ArgumentList @('--backend','--host','127.0.0.1','--port',"$port",'--no-browser') -PassThru
          try {
            $version = $null
            for ($i=0; $i -lt 50; $i++) {
              if ($backend.HasExited) { throw "Installed backend exited early: $($backend.ExitCode)" }
              try { $version = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 2; break } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $version) { throw 'Installed backend did not become healthy.' }
            if ($version.app -ne 'SleepMate' -or $version.version -ne '5.3.0' -or [int]$version.api -ne 20) { throw "Unexpected version API: $($version|ConvertTo-Json -Compress)" }

            $o2 = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if ($o2.feature_enabled -ne $false -or $o2.ble_enabled -ne $false) { throw "O2Ring must be fully hidden/disabled by default: $($o2|ConvertTo-Json -Compress)" }
            if ($o2.settings.o2ring_ble_enabled -ne $true) { throw 'BLE preference default must remain ready while master feature is off.' }

            $prefs = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/ui/preferences" -TimeoutSec 5
            if ([int]$prefs.pwa_bottom_nav_max -ne 6 -or @($prefs.pwa_bottom_nav).Count -ne 5) { throw "Unexpected PWA defaults: $($prefs|ConvertTo-Json -Compress)" }
            $navBody = @{pwa_bottom_nav=@('dashboard','sessions','charts','ai','reports','more')} | ConvertTo-Json -Compress
            $prefs2 = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/ui/preferences" -Method Post -ContentType 'application/json' -Body $navBody -TimeoutSec 5
            if (@($prefs2.pwa_bottom_nav).Count -ne 6 -or $prefs2.pwa_bottom_nav[4] -ne 'reports') { throw "Six-item PWA menu ordering failed: $($prefs2|ConvertTo-Json -Compress)" }

            $enableBody = @{o2ring_enabled=$true;o2ring_ble_enabled=$false;o2ring_auto_connect=$true;o2ring_preferred_address='CI-RING-REMEMBERED'} | ConvertTo-Json -Compress
            $null = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/o2ring/settings" -Method Post -ContentType 'application/json' -Body $enableBody -TimeoutSec 5
            $o2On = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if ($o2On.feature_enabled -ne $true -or $o2On.ble_enabled -ne $false) { throw 'Master-on/BLE-off contract failed.' }
            if ($o2On.settings.o2ring_preferred_address -ne 'CI-RING-REMEMBERED') { throw 'Remembered ring was not persisted.' }
            $offBody = @{o2ring_enabled=$false} | ConvertTo-Json -Compress
            $null = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/o2ring/settings" -Method Post -ContentType 'application/json' -Body $offBody -TimeoutSec 5
            $o2Off = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/o2ring/status" -TimeoutSec 5
            if ($o2Off.feature_enabled -ne $false -or $o2Off.settings.o2ring_preferred_address -ne 'CI-RING-REMEMBERED') { throw 'Master-off must preserve remembered ring.' }

            $html = (Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 5).Content
            foreach ($needle in @('sleepmate-v530.js','sleepmate-v530.css','sleepmate-aurora.css')) { if ($html -notmatch [regex]::Escape($needle)) { throw "Installed shell missing $needle" } }
            if ($html -match 'data-page="oximetry"') { throw 'Base HTML must not hard-code an Oximetria menu slot while feature is disabled.' }

            try { Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/system/shutdown" -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null } catch {}
            if (-not $backend.WaitForExit(10000)) { Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue }
          }
          finally { if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue } }

          if (-not (Test-Path $stateDir)) { throw 'User state directory was not created.' }
          $uninstaller = Start-Process -FilePath 'msiexec.exe' -ArgumentList @('/x',"`"$msi`"",'/qn','/norestart','/L*v',"`"$uninstallLog`"") -Wait -PassThru
          if ($uninstaller.ExitCode -notin @(0,3010)) { if(Test-Path $uninstallLog){Get-Content $uninstallLog|Select-Object -Last 200|Write-Host}; throw "MSI uninstall failed: $($uninstaller.ExitCode)" }
          if (Test-Path $exe) { throw 'SleepMate.exe remained after uninstall.' }
          if (-not (Test-Path $stateDir)) { throw 'User state must survive uninstall.' }

      - name: Upload complete v5.3 unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-v530-UNSIGNED-CANDIDATE
          path: |
            ci-msi/release/SleepMate_Setup_v5.3.0.msi
            ci-msi/release/SleepMate_Setup_v5.3.0.msi.sha256
          if-no-files-found: error
          retention-days: 2
