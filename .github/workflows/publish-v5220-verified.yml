name: Publish v5.2.20 verified release

on:
  push:
    branches:
      - installer-wizard
    paths:
      - .github/workflows/publish-v5220-verified.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-v5220:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN: "33485041215"
      TARGET_SHA: "d1516fb39a67d4666504c885fe1ab80f5b89022e"
      VERSION: "5.2.20"
      TAG: "v5.2.20"
      ARTIFACT_NAME: "SleepMate-Windows-x64-VERIFIED-RELEASE"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify canonical source run identity
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          test "$(jq -r '.status' <<<"$run_json")" = "completed"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$TARGET_SHA"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "installer-wizard"
          echo "Verified source run $SOURCE_RUN at $TARGET_SHA"

      - name: Download exact verified release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir -p release-staging
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release-staging
          find release-staging -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Re-verify release set and identity
        shell: bash
        run: |
          set -euo pipefail
          cd release-staging

          required=(
            "SleepMate_Setup_v${VERSION}.msi"
            "SleepMate_Setup_v${VERSION}.msi.sha256"
            "SleepMate_v${VERSION}_windows_x64.zip"
            "sleepmate-update.json"
            "release-metadata.json"
            "msi-inventory.txt"
            "build-msi-toolchain.txt"
            "SHA256SUMS.txt"
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing required release file: $f" >&2; exit 1; }
          done

          sha256sum -c SHA256SUMS.txt

          test "$(jq -r '.version' release-metadata.json)" = "$VERSION"
          test "$(jq -r '.git_commit' release-metadata.json)" = "$TARGET_SHA"
          test "$(jq -r '.signed' release-metadata.json)" = "false"

          portable="SleepMate_v${VERSION}_windows_x64.zip"
          test "$(jq -r '.version' sleepmate-update.json)" = "$VERSION"
          test "$(jq -r '.asset' sleepmate-update.json)" = "$portable"
          test "$(jq -r '.package_type' sleepmate-update.json)" = "windows-x64-program-tree"
          test "$(jq -r '.git_commit' sleepmate-update.json)" = "$TARGET_SHA"
          test "$(jq -r '.requires_installer' sleepmate-update.json)" = "false"
          zip_hash="$(sha256sum "$portable" | awk '{print $1}')"
          test "$(jq -r '.sha256' sleepmate-update.json)" = "$zip_hash"

          msi_hash="$(sha256sum "SleepMate_Setup_v${VERSION}.msi" | awk '{print $1}')"
          grep -qi "$msi_hash" "SleepMate_Setup_v${VERSION}.msi.sha256"

          echo "Release set cryptographically re-verified. MSI SHA-256: $msi_hash"

      - name: Build release notes from exact target
        shell: bash
        run: |
          set -euo pipefail
          awk '
            NR == 1 { print; next }
            /^---$/ { exit }
            { print }
          ' RELEASE_NOTES.md > release-v5220-notes.md
          test -s release-v5220-notes.md
          grep -q '^# SleepMate 5.2.20$' release-v5220-notes.md

      - name: Create or resume draft and upload verified assets
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "A published release already exists for $TAG; refusing to overwrite." >&2
            exit 1
          fi

          release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n1)"

          if [[ -z "$release_id" ]]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SleepMate 5.2.20 — Windows MSI + hivatalos frissítések" \
              --notes-file release-v5220-notes.md \
              --draft
            release_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n1)"
          fi

          test -n "$release_id"
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          test "$(jq -r '.draft' <<<"$draft")" = "true"
          test "$(jq -r '.tag_name' <<<"$draft")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$draft")" = "$TARGET_SHA"

          gh release upload "$TAG" release-staging/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Verify draft asset set and publish
        shell: bash
        run: |
          set -euo pipefail

          expected="$(printf '%s\n' \
            "SleepMate_Setup_v${VERSION}.msi" \
            "SleepMate_Setup_v${VERSION}.msi.sha256" \
            "SleepMate_v${VERSION}_windows_x64.zip" \
            "sleepmate-update.json" \
            "release-metadata.json" \
            "msi-inventory.txt" \
            "build-msi-toolchain.txt" \
            "SHA256SUMS.txt" | sort)"

          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq '.[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected GitHub Release asset set." >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<<"$published")" = "false"
          test "$(jq -r '.prerelease' <<<"$published")" = "false"
          test "$(jq -r '.target_commitish' <<<"$published")" = "$TARGET_SHA"
          test "$(jq -r '.tag_name' <<<"$published")" = "$TAG"
          echo "Published $TAG from verified source $TARGET_SHA"
