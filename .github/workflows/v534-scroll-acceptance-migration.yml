name: v5.3.4 one-shot viewport acceptance migration

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make chart acceptance viewport-aware
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_v534_scroll_acceptance.py
          python -m py_compile scripts/v534_browser_acceptance.py
          grep -F 'canvas.scroll_into_view_if_needed()' scripts/v534_browser_acceptance.py
          rm scripts/_tmp_v534_scroll_acceptance.py
          rm .github/workflows/v534-scroll-acceptance-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v534_browser_acceptance.py scripts/_tmp_v534_scroll_acceptance.py .github/workflows/v534-scroll-acceptance-migration.yml
          git diff --cached --check
          git commit -m "Scroll O2 chart targets into view during packaged Edge acceptance"
          git push origin HEAD:v5.3.4-o2-full-refactor
