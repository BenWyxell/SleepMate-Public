name: Apply v5.3.5 locale-correct daily O2 acceptance

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/locale_acceptance_patch.py
      - .github/workflows/_v535_apply_locale_acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply locale-correct daily O2 acceptance
        run: python scripts/locale_acceptance_patch.py
      - name: Validate exact acceptance contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py scripts/v534_browser_acceptance_runner.py
          node --check web/o2ring.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_user_acceptance_matrix.py tests/test_v535_polish_contract.py tests/test_v534_acceptance_matrix.py
          git diff --check
      - name: Commit durable acceptance fix and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/locale_acceptance_patch.py .github/workflows/_v535_apply_locale_acceptance.yml
          git add scripts/v534_browser_acceptance.py
          git commit -m 'Use Hungarian locale for daily O2 median acceptance'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
