name: v5.3.4 one-shot O2 chart source migration

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative O2 runtime and self-remove migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('web/o2ring.js')
          text = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'Expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              text = text.replace(old, new, count)

          replace(
              "hover:{},chartControllers:new WeakMap(),statusTimer:null",
              "hover:{},hoverRaf:new Map(),chartControllers:new WeakMap(),statusTimer:null",
          )
          replace(
              "function medianDelta(rows){const ds=[];for(let i=1;i<rows.length;i++){const d=rows[i].timestamp-rows[i-1].timestamp;if(d>0&&d<120)ds.push(d)}if(!ds.length)return 1;ds.sort((a,b)=>a-b);return ds[Math.floor(ds.length/2)]}",
              "function medianDelta(rows,maxDelta=120){const ds=[];for(let i=1;i<rows.length;i++){const d=rows[i].timestamp-rows[i-1].timestamp;if(d>0&&(maxDelta==null||d<maxDelta))ds.push(d)}if(!ds.length)return 1;ds.sort((a,b)=>a-b);return ds[Math.floor(ds.length/2)]}\nfunction chartGap(rows,trendGap=false){return trendGap?Math.max(4,medianDelta(rows,null)*3.2):Math.max(4,medianDelta(rows)*3.2)}",
          )
          replace(
              "gap=Math.max(4,medianDelta(rows)*3.2);for(const s of series)",
              "gap=chartGap(rows,!!opts.trendGap);for(const s of series)",
          )
          replace(
              "function redrawGroup(group){for(const c of qa('canvas'))if(c._smO2Meta?.syncGroup===group)c._smO2Meta.redraw?.()}\nfunction setHover(group,t){R.hover[group]=t;requestAnimationFrame(()=>redrawGroup(group))}",
              "function redrawGroup(group){for(const c of qa('canvas'))if(c._smO2Meta?.syncGroup===group)c._smO2Meta.redraw?.()}\nfunction scheduleGroupRedraw(group){if(R.hoverRaf.has(group))return;const raf=requestAnimationFrame(()=>{R.hoverRaf.delete(group);redrawGroup(group)});R.hoverRaf.set(group,raf)}\nfunction setHover(group,t){R.hover[group]=t;scheduleGroupRedraw(group)}",
          )
          replace(
              "if(ctl.raf){cancelAnimationFrame(ctl.raf);ctl.raf=0}hideTooltip(c)}R.hover={}}",
              "if(ctl.raf){cancelAnimationFrame(ctl.raf);ctl.raf=0}hideTooltip(c)}for(const raf of R.hoverRaf.values())cancelAnimationFrame(raf);R.hoverRaf.clear();R.hover={}}",
          )
          replace(
              "delete R.hover[ctl.syncGroup];hideTooltip(c);requestAnimationFrame(()=>redrawGroup(ctl.syncGroup))",
              "delete R.hover[ctl.syncGroup];hideTooltip(c);scheduleGroupRedraw(ctl.syncGroup)",
          )
          replace(
              "async function refillLive(){const last=R.live.at(-1)?.timestamp||0;try{const x=await api(`/api/o2ring/live-buffer?since=${encodeURIComponent(last)}&limit=43200`);mergeLive(x.rows||[])}catch{}drawLive()}",
              "async function refillLive(since=null){const last=since==null?(R.live.at(-1)?.timestamp||0):(Number(since)||0);try{const x=await api(`/api/o2ring/live-buffer?since=${encodeURIComponent(last)}&limit=43200`);mergeLive(x.rows||[])}catch{}drawLive()}",
          )
          replace(
              "async function resumeLive(){if(!o2PageVisible())return;if(R.liveResumePromise)return R.liveResumePromise;R.liveResumePromise=(async()=>{await refillLive();if(o2PageVisible())openLiveStream()})().finally(()=>{R.liveResumePromise=null});return R.liveResumePromise}",
              "async function resumeLive(){if(!o2PageVisible())return;if(R.liveResumePromise)return R.liveResumePromise;const since=R.live.at(-1)?.timestamp||0;R.liveResumePromise=(async()=>{if(o2PageVisible())openLiveStream();await refillLive(since)})().finally(()=>{R.liveResumePromise=null});return R.liveResumePromise}",
          )
          replace(
              "function openOximetry(tab='live'){if(!R.installed)return;if(location.hash!=='#oximetry')history.pushState({sleepmate:true,o2:true},'', '#oximetry');showOximetry(tab)}",
              "function closeMobileO2Drawer(){try{if(typeof closeMobileSidebar==='function')closeMobileSidebar()}catch{}}\nfunction openOximetry(tab='live'){if(!R.installed)return;if(location.hash!=='#oximetry')history.pushState({sleepmate:true,o2:true},'', '#oximetry');closeMobileO2Drawer();showOximetry(tab)}",
          )
          replace(
              "chartDraw(c,rows,{range,series:ss,syncGroup:'dash-o2',rightAxis:false,redraw});",
              "chartDraw(c,rows,{range,series:ss,syncGroup:'dash-o2',rightAxis:false,trendGap:true,redraw});",
          )
          replace(
              "chartDraw(c,t,{range,series:ss,syncGroup:'trends',rightAxis:false,redraw});",
              "chartDraw(c,t,{range,series:ss,syncGroup:'trends',rightAxis:false,trendGap:true,redraw});",
          )

          path.write_text(text, encoding='utf-8')
          PY
          node --check web/o2ring.js
          python -m pip install --disable-pip-version-check pytest >/dev/null
          python -m pytest -q tests/test_o2ring_v534_release_contract.py tests/test_v534_acceptance_matrix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v534-chart-source-migration.yml
          git add web/o2ring.js
          git diff --cached --check
          git commit -m 'Fix O2 trend continuity and live chart lifecycle'
          git push origin HEAD:v5.3.4-o2-full-refactor
