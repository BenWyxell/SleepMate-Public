name: Apply v5.3.5 refreshed report statistics acceptance

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/report_stats_acceptance_patch.py
      - .github/workflows/_v535_report_stats_acceptance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply refreshed report statistics acceptance
        run: python scripts/report_stats_acceptance_patch.py
      - name: Remove one-shot helper files before release-tree validation
        run: git rm scripts/report_stats_acceptance_patch.py .github/workflows/_v535_report_stats_acceptance.yml
      - name: Validate 15-point contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py scripts/v534_browser_acceptance_runner.py
          node --check web/o2ring.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_user_acceptance_matrix.py tests/test_v535_polish_contract.py tests/test_v534_acceptance_matrix.py
          git diff --check
      - name: Commit durable report acceptance fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v534_browser_acceptance.py tests/test_v535_user_acceptance_matrix.py
          git commit -m 'Assert refreshed daily O2 report statistics'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
