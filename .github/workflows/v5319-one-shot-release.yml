name: SleepMate 5.3.19 one-shot verified publisher

on:
  push:
    branches:
      - release-v5.3.19-source
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sleepmate-v5.3.19-one-shot
  cancel-in-progress: true

jobs:
  publish-after-canonical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release identity, O2 recovery and stable updater contract
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          test "$VERSION" = '5.3.19'
          test "$GITHUB_REF_NAME" = 'release-v5.3.19-source'
          test -f release-notes/v5.3.19.md
          grep -F 'Release build: **5.3.19**.' release-notes/v5.3.19.md
          grep -F "f1ae4577887315b50c4c31f563d7d6c56da8a4ccfe2827f19a40dda7e8aa66e4" build/windows/build_release.ps1
          grep -F "473938fe42d561a31243326793d7894681996eb7" build/windows/build_release.ps1
          node --check web/frontend-v534.js
          node --check web/o2ring-recovery-v5318.js
          node --check web/service-worker.js
          node --check web/service-worker-v508-base.js
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_v5318_o2_desktop_recovery.py \
            tests/test_v5318_o2_lazy_store.py \
            tests/test_v5319_o2_and_updater_regressions.py

      - name: Refuse to overwrite an existing 5.3.19 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v5.3.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v5.3.19 already exists; refusing to overwrite it.' >&2
            exit 1
          fi

      - name: Dispatch canonical Windows release gate for this exact commit
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME"

          RUN_ID=''
          for _ in $(seq 1 40); do
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release.yml/runs?branch=$GITHUB_REF_NAME&event=workflow_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\") | .id" | head -n1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 3
          done
          if [[ -z "$RUN_ID" ]]; then
            echo 'Canonical Windows workflow run was not found for this commit.' >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Canonical run: $RUN_ID"

      - name: Wait for full Windows build, frozen O2 acceptance, MSI smoke and verification
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 210); do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
            echo "canonical status=$STATUS conclusion=$CONCLUSION"
            if [[ "$STATUS" == 'completed' ]]; then
              if [[ "$CONCLUSION" != 'success' ]]; then
                gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" || true
                exit 1
              fi
              exit 0
            fi
            sleep 20
          done
          echo 'Canonical Windows workflow did not finish inside the publisher timeout.' >&2
          exit 1

      - name: Download canonical VERIFIED release set
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir release-staging
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name SleepMate-Windows-x64-VERIFIED-RELEASE \
            --dir release-staging
          find release-staging -maxdepth 2 -type f -printf '%P\n' | sort

      - name: Verify MSI, manifest, source SHA and exact stable updater bytes
        shell: bash
        run: |
          set -euo pipefail
          MSI='SleepMate_Setup_v5.3.19.msi'
          ZIP='SleepMate_v5.3.19_windows_x64.zip'
          UPDATER_SHA='f1ae4577887315b50c4c31f563d7d6c56da8a4ccfe2827f19a40dda7e8aa66e4'
          test -f "release-staging/$MSI"
          test -f "release-staging/$MSI.sha256"
          test -f "release-staging/$ZIP"
          test -f release-staging/sleepmate-update.json
          test -f release-staging/release-metadata.json
          test -f release-staging/SHA256SUMS.txt
          (
            cd release-staging
            sha256sum -c "$MSI.sha256"
          )
          test "$(jq -r '.version' release-staging/sleepmate-update.json)" = '5.3.19'
          test "$(jq -r '.asset' release-staging/sleepmate-update.json)" = "$MSI"
          META_SHA="$(jq -r '.source_sha // .commit_sha // .sha // empty' release-staging/release-metadata.json)"
          if [[ -n "$META_SHA" ]]; then test "$META_SHA" = "$GITHUB_SHA"; fi
          grep -F "$MSI" release-staging/SHA256SUMS.txt >/dev/null
          grep -F "$ZIP" release-staging/SHA256SUMS.txt >/dev/null

          rm -rf updater-check
          mkdir updater-check
          unzip -q "release-staging/$ZIP" -d updater-check
          UPDATER="$(find updater-check -type f -path '*/Updater/SleepMateUpdater.exe' -print -quit)"
          test -n "$UPDATER"
          ACTUAL_UPDATER_SHA="$(sha256sum "$UPDATER" | awk '{print $1}')"
          test "$ACTUAL_UPDATER_SHA" = "$UPDATER_SHA"
          echo "Stable updater byte identity verified: $ACTUAL_UPDATER_SHA"

      - name: Create draft GitHub Release from VERIFIED artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v5.3.19 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'SleepMate 5.3.19 — O2Ring indulás és stabil updater' \
            --notes-file release-notes/v5.3.19.md \
            --draft
          gh release upload v5.3.19 release-staging/* --repo "$GITHUB_REPOSITORY"

      - name: Verify asset set and make 5.3.19 stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(gh release view v5.3.19 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          LOCAL="$(find release-staging -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$REMOTE" != "$LOCAL" ]]; then
            echo 'Release asset set does not exactly match VERIFIED artifact.' >&2
            diff -u <(printf '%s\n' "$LOCAL") <(printf '%s\n' "$REMOTE") || true
            exit 1
          fi
          gh release edit v5.3.19 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view v5.3.19 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,url
