name: Clean v5.3.17 test diff

on:
  push:
    branches:
      - v5317-clean-test-diff-helper

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.16-fixes
          fetch-depth: 0
      - name: Restore unrelated tests and keep only intended regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5317-tests
          cp tests/test_v537_targeted_fixes.py /tmp/v5317-tests/
          cp tests/test_pwa_sleep_shell_v526.py /tmp/v5317-tests/
          cp tests/test_v5315_pwa_daily_delivery_and_o2.py /tmp/v5317-tests/
          cp tests/test_v5317_pwa_generation_handover.py /tmp/v5317-tests/
          git checkout origin/v5.3.5-stable-base -- tests
          cp /tmp/v5317-tests/test_v537_targeted_fixes.py tests/
          cp /tmp/v5317-tests/test_pwa_sleep_shell_v526.py tests/
          cp /tmp/v5317-tests/test_v5315_pwa_daily_delivery_and_o2.py tests/
          cp /tmp/v5317-tests/test_v5317_pwa_generation_handover.py tests/
          python -m pip install -q pytest
          python -m pytest -q tests/test_v5317_pwa_generation_handover.py tests/test_v537_targeted_fixes.py tests/test_pwa_sleep_shell_v526.py tests/test_v5315_pwa_daily_delivery_and_o2.py tests/test_o2ring_v534_release_contract.py tests/test_v5316_daily_o2_format_and_ahi_span.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Clean PWA regression test diff"
          git push origin HEAD:v5.3.16-fixes
