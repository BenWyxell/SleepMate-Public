name: Apply final v5.3.4 acceptance polish

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor
    paths:
      - scripts/apply_v534_acceptance_polish.py
      - .github/workflows/v534-apply-acceptance-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.4-o2-full-refactor
          fetch-depth: 0
      - name: Apply acceptance polish
        run: python scripts/apply_v534_acceptance_polish.py
      - name: Validate syntax
        run: |
          node --check web/o2ring.js
          node --check web/frontend-v534.js
          python -m py_compile cpap/o2ring_runtime_v534.py
      - name: Commit source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_v534_acceptance_polish.py .github/workflows/v534-apply-acceptance-polish.yml
          git add web/o2ring.js web/frontend-v534.js web/o2ring-v534.css tests/test_o2ring_v534_release_contract.py
          git commit -m 'Finish v5.3.4 O2 overlay and settings acceptance details'
          git push origin HEAD:v5.3.4-o2-full-refactor
