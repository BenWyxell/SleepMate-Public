name: Apply v5.3.17 PWA generation recovery overhaul

on:
  push:
    branches:
      - v5317-pwa-generation-fix-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current fixes branch
        uses: actions/checkout@v4
        with:
          ref: v5.3.16-fixes
          fetch-depth: 0

      - name: Apply coherent PWA generation and bootstrap fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Canonical, atomic Service Worker generation handover.
          # ------------------------------------------------------------------
          for worker_path in ('web/service-worker.js', 'web/service-worker-v508-base.js'):
              text = read(worker_path)
              ui = "const UI_VERSION='5.3.4';"
              if ui not in text:
                  raise SystemExit(f'{worker_path}: UI_VERSION marker missing')
              if "const BUILD_ID=" not in text:
                  text = text.replace(
                      ui,
                      ui + "\nconst RELEASE_VERSION='5.3.16';\nconst BUILD_ID='5.3.16';",
                      1,
                  )

              start = text.index('async function cacheShellAsset')
              end = text.index('function backendUnavailable', start)
              handover = r'''const OPTIONAL_SHELL_ASSETS=new Set(['/assets/pwa-192.png','/assets/pwa-512.png','/assets/sleepmate-icon-v410.webp','/assets/sleepmate-splash-v410.webp','/assets/sleepsync-aurora.svg','/assets/sleepsync-mark.svg','/assets/sleepsync-logo.webp','/assets/sidebar-aurora-line.svg']);
async function cacheShellAsset(cache,url){const controller=typeof AbortController==='function'?new AbortController():null;const timer=controller?setTimeout(()=>controller.abort(),5000):null;try{const response=await fetch(url,{cache:'no-store',signal:controller?.signal});if(!response.ok)throw new Error(`Shell asset ${url}: HTTP ${response.status}`);await cache.put(url,response.clone())}finally{if(timer)clearTimeout(timer)}}
async function precacheShellAtomic(){const cache=await caches.open(SHELL_CACHE);for(const url of SHELL){try{await cacheShellAsset(cache,url)}catch(error){const pathname=new URL(url,self.location.origin).pathname;if(!OPTIONAL_SHELL_ASSETS.has(pathname))throw error}}}
function isSleepMateCache(key){return key.startsWith('sleepmate-shell-')||key.startsWith('sleepmate-api-')}
async function cleanupStaleSleepMateCaches(){const keys=await caches.keys(),keep=new Set([SHELL_CACHE,API_CACHE]),stale=keys.filter(key=>isSleepMateCache(key)&&!keep.has(key));await Promise.all(stale.map(key=>caches.delete(key)))}
self.addEventListener('install',event=>event.waitUntil((async()=>{await precacheShellAtomic();await self.skipWaiting()})()));
self.addEventListener('activate',event=>event.waitUntil((async()=>{const keys=await caches.keys(),hadPreviousShell=keys.some(key=>key.startsWith('sleepmate-shell-')&&key!==SHELL_CACHE);await self.clients.claim();const windows=await self.clients.matchAll({type:'window',includeUncontrolled:true});for(const client of windows)client.postMessage({type:'SLEEPMATE_SHELL_READY',uiVersion:UI_VERSION,releaseVersion:RELEASE_VERSION,buildId:BUILD_ID,hadPreviousShell});if(hadPreviousShell)await Promise.all(windows.map(async client=>{try{await client.navigate(client.url)}catch{}}))})()));
self.addEventListener('message',event=>{const data=event.data||{};if(data.type!=='SLEEPMATE_CLIENT_READY'||data.buildId!==BUILD_ID)return;event.waitUntil(cleanupStaleSleepMateCaches())});
'''
              text = text[:start] + handover + text[end:]
              write(worker_path, text)

          # ------------------------------------------------------------------
          # 2) PWA page lifecycle: update/reconcile on wake and real standalone
          #    handover. Do not leave a 5.3.x page running against a newer backend.
          # ------------------------------------------------------------------
          app_path = 'web/app-core.js'
          app = read(app_path)
          start = app.index('function registerPwa(){')
          end = app.index('async function installPwa(){', start)
          register = r'''function pwaMeta(name){return document.querySelector(`meta[name="${name}"]`)?.content||''}
function pwaReleaseVersion(){return pwaMeta('sleepmate-release-version')}
function pwaBuildId(){return pwaMeta('sleepmate-build-id')}
function postPwaClientReady(reg=null){const buildId=pwaBuildId(),releaseVersion=pwaReleaseVersion(),target=navigator.serviceWorker?.controller||reg?.active;if(!buildId||!target)return;try{target.postMessage({type:'SLEEPMATE_CLIENT_READY',buildId,releaseVersion})}catch{}}
async function reconcilePwaRelease(reason='resume'){
  if(!('serviceWorker' in navigator))return;
  let reg=null;try{reg=await navigator.serviceWorker.getRegistration()}catch{}
  let backend='';try{const r=await fetch(`/api/version?_pwa=${Date.now()}`,{cache:'no-store'});if(r.ok){const x=await r.json();backend=String(x.version||'')}}catch{}
  const page=pwaReleaseVersion();
  if(backend&&page&&backend!==page){
    try{await reg?.update?.()}catch{}
    const key=`sleepmate-release-reload:${backend}`;
    if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');location.reload();return}
  }
  if(backend&&page&&backend===page){for(const key of Object.keys(sessionStorage))if(key.startsWith('sleepmate-release-reload:')&&key!==`sleepmate-release-reload:${backend}`)sessionStorage.removeItem(key)}
  postPwaClientReady(reg);
}
function bindPwaReleaseRecovery(){
  if(document.documentElement.dataset.smPwaReleaseRecovery==='1')return;
  document.documentElement.dataset.smPwaReleaseRecovery='1';
  const reconcile=()=>reconcilePwaRelease().catch(()=>{});
  window.addEventListener('pageshow',reconcile);
  window.addEventListener('focus',reconcile);
  window.addEventListener('online',reconcile);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reconcile()});
  navigator.serviceWorker?.ready?.then(reg=>{postPwaClientReady(reg);reconcile()}).catch(()=>{});
}
function registerPwa(){
  if('serviceWorker' in navigator){
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('/service-worker.js',{updateViaCache:'none'}).then(async reg=>{try{await reg.update()}catch{}postPwaClientReady(reg);reconcilePwaRelease('register').catch(()=>{})}).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(!hadController)return;
      const build=pwaBuildId()||'unknown',key=`sleepmate-controller-reload:${build}`;
      if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,'1');setTimeout(()=>location.reload(),80)}
    });
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.pwaPrompt=e;const b=$('#pwaInstallButton');if(b){b.disabled=false;$('#pwaInstallHint').textContent='A SleepMate telepíthető ezen az eszközön.'}});
  window.addEventListener('appinstalled',()=>{state.pwaPrompt=null;const b=$('#pwaInstallButton');if(b)b.disabled=true;if($('#pwaInstallHint'))$('#pwaInstallHint').textContent='A SleepMate telepítve van ezen az eszközön.';updatePwaStatus()});
  const standalone=window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone&&$('#pwaInstallHint')){$('#pwaInstallHint').textContent='A SleepMate már alkalmazásnézetben fut.';$('#pwaInstallButton').disabled=true}
  else if(!state.pwaPrompt&&$('#pwaInstallHint')){const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);$('#pwaInstallHint').textContent=ios?'iPhone/iPad: Safari → Megosztás → Főképernyőhöz adás.':'HTTPS-es Tailscale vagy Cloudflare címen a böngésző felajánlja a telepítést.'}
  bindPwaReleaseRecovery();
}
'''
          app = app[:start] + register + app[end:]
          write(app_path, app)

          # ------------------------------------------------------------------
          # 3) Never let the frozen UI generation delete release caches itself.
          #    The worker is the only cache-generation owner.
          # ------------------------------------------------------------------
          frontend_path = 'web/frontend-v534.js'
          frontend = read(frontend_path)
          f_start = frontend.index('async function enforceFrontendGeneration(){')
          f_end = frontend.index('\nfunction ', f_start)
