    new_api = """window.SleepMateV530={ICONS,NAV,renderBottomNav,renderPwaEditor,preferences:()=>({...prefs}),o2State:()=>o2State,refreshO2:refreshO2State,ensureO2:ensureO2Modules,installO2Master:installO2MasterPanel};"""
