}'''
          frontend = frontend[:f_start] + safe_frontend + frontend[f_end:]
          write(frontend_path, frontend)

          # ------------------------------------------------------------------
          # 4) Server-side v5.3 shell: same build id for HTML and every dynamic
          #    O2 asset, plus idempotent/safe runtime patching.
          # ------------------------------------------------------------------
          shell_path = 'cpap/v530_features.py'
          shell = read(shell_path)
          shell = replace_once(shell, 'import urllib.parse\n', 'import urllib.parse\nimport re\n\nfrom .version import APP_VERSION\n', 'v530 imports')

          sf_start = shell.index('def _patch_frontend_v534')
          sf_end = shell.index('\ndef _patch_sleepmate_v530', sf_start)
          safe_patch = r'''def _patch_frontend_v534(text: str) -> str:
