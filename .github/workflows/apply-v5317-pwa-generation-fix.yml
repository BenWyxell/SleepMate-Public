          shell = shell.replace("f'<link rel=\"stylesheet\" href=\"/sleepmate-v530.css?v={UI_VERSION}\">'", "f'<link rel=\"stylesheet\" href=\"/sleepmate-v530.css?v={asset_version}\">'")
