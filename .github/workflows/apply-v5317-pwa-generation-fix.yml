name: Apply v5.3.17 PWA generation recovery overhaul

on:
  push:
    branches:
      - v5317-pwa-generation-fix-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current fixes branch
        uses: actions/checkout@v4
        with:
          ref: v5.3.16-fixes
          fetch-depth: 0

      - name: Checkout helper tools
        uses: actions/checkout@v4
        with:
          ref: v5317-pwa-generation-fix-helper
          path: .helper
          fetch-depth: 1

      - name: Apply coherent PWA generation and bootstrap fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .helper/.github/scripts/apply_v5317_pwa_generation_fix.py
          python .helper/.github/scripts/update_v5317_tests.py

      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_v5317_pwa_generation_handover.py \
            tests/test_v537_targeted_fixes.py \
            tests/test_pwa_sleep_shell_v526.py \
            tests/test_o2ring_v534_release_contract.py \
            tests/test_v5315_pwa_daily_delivery_and_o2.py \
            tests/test_v5316_daily_o2_format_and_ahi_span.py
          grep -R "clients.claim.*not in\|copy2(proven_sw" tests build/windows web cpap || true

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .helper
          git add web/service-worker.js web/service-worker-v508-base.js web/app-core.js web/frontend-v534.js cpap/v530_features.py build/windows/SleepMate.spec tests/
          git commit -m "Rebuild PWA generation handover and O2 bootstrap reliability"
          git push origin HEAD:v5.3.16-fixes
