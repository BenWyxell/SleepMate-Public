name: Align remaining v5.3.5 cache contracts

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align remaining release/cache identity assertions only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/test_mobile_ai_push_v417.py': [
                  ("assert 'sleepmate-shell-v5.3.4-refactor' in SW", "assert 'sleepmate-shell-v5.3.5-refactor' in SW"),
                  ("assert 'sleepmate-api-v5.3.4-refactor' in SW", "assert 'sleepmate-api-v5.3.5-refactor' in SW"),
              ],
              'tests/test_o2ring_v532_release_contract.py': [
                  ('assert APP_VERSION=="5.3.4" and API_VERSION==19 and BUILD_CHANNEL=="stable"', 'assert APP_VERSION=="5.3.5" and API_VERSION==19 and BUILD_CHANNEL=="stable"'),
              ],
              'tests/test_pwa_sleep_shell_v526.py': [
                  ('rotated to the v5.3.4 refactor generation.', 'rotated to the v5.3.5 release-cache generation.'),
                  ('assert "sleepmate-shell-v5.3.4-refactor" in sw', 'assert "sleepmate-shell-v5.3.5-refactor" in sw'),
                  ('assert "sleepmate-api-v5.3.4-refactor" in sw', 'assert "sleepmate-api-v5.3.5-refactor" in sw'),
                  ('assert "sleepmate-shell-v5.3.4" in sw', 'assert "sleepmate-shell-v5.3.5" in sw'),
                  ('assert "sleepmate-api-v5.3.4" in sw', 'assert "sleepmate-api-v5.3.5" in sw'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{name}: expected exactly one {old!r}, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot helper before validation
        shell: bash
        run: rm -f .github/workflows/_v535_legacy_cache_contract_patch.yml
      - name: Validate failed contracts and final release identity
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_mobile_ai_push_v417.py \
            tests/test_o2ring_v532_release_contract.py \
            tests/test_pwa_sleep_shell_v526.py \
            tests/test_v535_user_acceptance_matrix.py \
            tests/test_pwa_drawer_v412.py \
            tests/test_release_version_contract.py
      - name: Commit clean legacy contract alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_mobile_ai_push_v417.py tests/test_o2ring_v532_release_contract.py tests/test_pwa_sleep_shell_v526.py .github/workflows/_v535_legacy_cache_contract_patch.yml
          git diff --cached --quiet && { echo 'No legacy cache contract changes to commit.' >&2; exit 1; }
          git commit -m 'Align remaining release cache contracts with v5.3.5'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
