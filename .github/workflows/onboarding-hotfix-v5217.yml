name: One-time onboarding desktop wizard hotfix

on:
  push:
    branches:
      - installer-wizard
    paths:
      - '.github/workflows/onboarding-hotfix-v5217.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v4
        with:
          ref: installer-wizard
          fetch-depth: 0

      - name: Apply onboarding hotfix
        shell: pwsh
        run: python scripts/hotfix_onboarding_v5217.py

      - name: Verify hotfix contract
        shell: pwsh
        run: |
          node --check web/first-run.js
          node --check web/sleepsync-hydration-v529.js
          python -m pytest -q tests/test_first_run_wizard_v5217_hotfix.py

      - name: Commit patched wizard
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/first-run.js web/first-run.css web/sleepsync-hydration-v529.js tests/test_first_run_wizard_v5217_hotfix.py
          git commit -m 'fix(onboarding): make wizard globally scrollable and desktop-focused'
          git push origin HEAD:installer-wizard
