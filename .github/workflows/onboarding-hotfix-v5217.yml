name: One-time onboarding desktop wizard hotfix

on:
  push:
    branches:
      - installer-wizard
    paths:
      - '.github/workflows/onboarding-hotfix-v5217.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v4
        with:
          ref: installer-wizard
          fetch-depth: 0

      - name: Patch first-run wizard
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          js_path = Path('web/first-run.js')
          js = js_path.read_text(encoding='utf-8')

          replacements = {
              "link.rel='stylesheet';link.href='/first-run.css?v=1';link.dataset.sleepmateFirstRun='1';": "link.rel='stylesheet';link.href='/first-run.css?v=2';link.dataset.sleepmateFirstRun='1';",
              '<div class="fr-brand"><img class="fr-logo" src="/assets/sleepmate-logo.webp" onerror="this.src=\'/assets/icon-192.png\'" alt=""><div><b>SleepMate</b><small>Első beállítás</small></div></div>': '<div class="fr-brand"><div><b>SleepMate</b><small>Első beállítás</small></div></div>',
              'A program már telepítve van. Itt azokat a dolgokat állítjuk be, amelyek gépenként vagy felhasználónként eltérnek: terápiás adatok, SleepSync, távoli elérés, PWA, értesítések, backup és opcionális AI.': 'A program már telepítve van. Itt azokat a dolgokat állítjuk be, amelyek gépenként vagy felhasználónként eltérnek: terápiás adatok, SleepSync, távoli elérés, backup és opcionális AI.',
              '''            <h1 class="fr-title">PWA, értesítések, backup és <span class="fr-highlight">AI</span>.</h1>
            <p class="fr-lead">Ezek opcionálisak. A böngésző biztonsági szabályai miatt a PWA telepítéséhez és az értesítési engedélyhez neked kell rákattintanod a megfelelő gombra — ezt egy MSI nem adhatja meg helyetted.</p>
            <div class="fr-grid">
              <div class="fr-card"><div class="fr-icon">📱</div><h3>PWA + Web Push</h3><p>A jelenlegi eszközön telepítheted alkalmazásként és engedélyezheted a valódi háttérértesítéseket.</p><div class="fr-actions"><button class="fr-btn primary" id="frPwaInstall" type="button">PWA telepítése</button><button class="fr-btn" id="frNotify" type="button">Értesítések engedélyezése</button></div></div>
              <div class="fr-card"><div class="fr-icon">🛟</div><h3>Automatikus backup</h3><p>Alapértelmezés szerint heti teljes SleepMate biztonsági mentést tudunk bekapcsolni.</p><label class="fr-check"><input id="frBackup" type="checkbox"><span>Heti automatikus backup bekapcsolása</span></label></div>
            </div>''': '''            <h1 class="fr-title">Backup és <span class="fr-highlight">AI</span>.</h1>
            <p class="fr-lead">Mindkettő opcionális. Itt bekapcsolhatod a heti automatikus biztonsági mentést, illetve megadhatod a helyben, DPAPI-val titkosított AI API-kulcsokat.</p>
            <div class="fr-grid single">
              <div class="fr-card"><div class="fr-icon">🛟</div><h3>Automatikus backup</h3><p>Alapértelmezés szerint heti teljes SleepMate biztonsági mentést tudunk bekapcsolni.</p><label class="fr-check"><input id="frBackup" type="checkbox"><span>Heti automatikus backup bekapcsolása</span></label></div>
            </div>''',
              '''      ['✨','Luna / Milo',state.choices.gemini_configured||state.choices.groq_configured?'Legalább egy AI beállítva':'Később állítható'],
      ['📱','PWA / értesítések',state.choices.notifications_attempted?'Engedélykérés megtörtént':state.choices.pwa_attempted?'PWA telepítés megnyitva':'Később is bekapcsolható']''': '''      ['✨','Luna / Milo',state.choices.gemini_configured||state.choices.groq_configured?'Legalább egy AI beállítva':'Később állítható']''',
              '''    $('#frTsOpen',root).onclick=()=>{const u=$('#frTsUrl').textContent.trim();if(u)window.open(u,'_blank','noopener')};
    $('#frPwaInstall',root).onclick=async()=>{choicePatch({pwa_attempted:true});if(typeof window.installPwa==='function'){try{await window.installPwa()}catch(e){message(e.message,'error')}}else message('A PWA telepítő még nem áll készen. Próbáld meg pár másodperc múlva vagy a Beállításokból.','info')};
    $('#frNotify',root).onclick=async()=>{choicePatch({notifications_attempted:true});if(typeof window.enablePwaNotifications==='function'){try{await window.enablePwaNotifications();message('Az értesítési engedélykérés lefutott.','ok')}catch(e){message(e.message,'error')}}else message('Az értesítési modul még nem áll készen. A Beállításokból később bekapcsolható.','info')};''': '''    $('#frTsOpen',root).onclick=()=>{const u=$('#frTsUrl').textContent.trim();if(u)window.open(u,'_blank','noopener')};''',
              "    $('.fr-body')?.scrollTo({top:0,behavior:'smooth'});persistProgress(state.step);": "    const body=$('.fr-body');if(body)body.scrollTop=0;persistProgress(state.step);",
              'Újra végigvezet az adatforrás, SleepSync, távoli elérés, PWA, backup és AI alapbeállításain.': 'Újra végigvezet az adatforrás, SleepSync, távoli elérés, backup és AI alapbeállításain.',
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'Missing first-run.js patch target: {old[:160]!r}')
              js = js.replace(old, new)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('web/first-run.css')
          css = css_path.read_text(encoding='utf-8')
          css_replacements = {
              '.fr-shell{width:min(980px,100%);max-height:min(820px,calc(100vh - 52px));display:grid;grid-template-rows:auto 1fr auto;': '.fr-shell{width:min(980px,100%);height:min(820px,calc(100vh - 52px));height:min(820px,calc(100dvh - 52px));max-height:calc(100vh - 52px);max-height:calc(100dvh - 52px);min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;',
              '.fr-top{display:flex;': '.fr-top{position:relative;z-index:2;display:flex;',
              '.fr-brand{display:flex;align-items:center;gap:13px;min-width:215px}.fr-logo{width:50px;height:50px;border-radius:16px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}': '.fr-brand{display:flex;align-items:center;min-width:215px}.fr-logo{display:none}',
              '.fr-body{overflow:auto;padding:34px 38px 28px;scrollbar-width:thin}': '.fr-body{min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-gutter:stable;padding:34px 38px 28px;-webkit-overflow-scrolling:touch}',
              '.fr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}': '.fr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fr-grid.single{grid-template-columns:1fr}',
              '.fr-footer{display:flex;': '.fr-footer{position:relative;z-index:2;display:flex;',
              '#sleepmateFirstRun.fr-hidden{display:none}': '#sleepmateFirstRun.fr-hidden{display:none}html.fr-open,html.fr-open body{overflow:hidden}',
              '@media(max-width:760px){#sleepmateFirstRun{padding:0}.fr-shell{height:100%;max-height:none;border-radius:0;border:0}': '@media(max-width:760px){#sleepmateFirstRun{padding:0}.fr-shell{height:100vh;height:100dvh;max-height:none;min-height:0;border-radius:0;border:0}',
          }
          for old, new in css_replacements.items():
              if old not in css:
                  raise SystemExit(f'Missing first-run.css patch target: {old[:160]!r}')
              css = css.replace(old, new)
          compact = '@media(max-height:700px) and (min-width:761px){#sleepmateFirstRun{padding:12px}.fr-shell{height:calc(100vh - 24px);height:calc(100dvh - 24px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px)}.fr-top{padding:14px 22px}.fr-body{padding:24px 30px 20px}.fr-footer{padding:12px 20px}}\n'
          marker = '@media(max-width:760px)'
          if marker not in css:
              raise SystemExit('Missing responsive CSS marker')
          css = css.replace(marker, compact + marker, 1)
          css_path.write_text(css, encoding='utf-8')

          hydration_path = Path('web/sleepsync-hydration-v529.js')
          hydration = hydration_path.read_text(encoding='utf-8')
          old_loader = "script.src='/first-run.js?v=1';"
          if old_loader not in hydration:
              raise SystemExit('Missing first-run loader version target')
          hydration_path.write_text(hydration.replace(old_loader, "script.src='/first-run.js?v=2';"), encoding='utf-8')

          test_path = Path('tests/test_first_run_wizard_v5217_hotfix.py')
          test_path.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nJS = (ROOT / "web" / "first-run.js").read_text(encoding="utf-8")\nCSS = (ROOT / "web" / "first-run.css").read_text(encoding="utf-8")\nHYDRATION = (ROOT / "web" / "sleepsync-hydration-v529.js").read_text(encoding="utf-8")\n\ndef test_desktop_first_run_has_no_pwa_or_broken_brand_image():\n    assert "sleepmate-logo.webp" not in JS\n    assert "icon-192.png" not in JS\n    assert "frPwaInstall" not in JS\n    assert "frNotify" not in JS\n    assert "PWA + Web Push" not in JS\n    assert "PWA / értesítések" not in JS\n\ndef test_every_wizard_step_uses_global_scrollable_body():\n    assert "grid-template-rows:auto minmax(0,1fr) auto" in CSS\n    assert ".fr-body{min-width:0;min-height:0;overflow-x:hidden;overflow-y:auto" in CSS\n    assert "height:min(820px,calc(100dvh - 52px))" in CSS\n    assert "height:100dvh" in CSS\n    assert "html.fr-open,html.fr-open body{overflow:hidden}" in CSS\n    assert "body.scrollTop=0" in JS\n\ndef test_first_run_cache_busters_follow_hotfix():\n    assert "/first-run.css?v=2" in JS\n    assert "/first-run.js?v=2" in HYDRATION\n''', encoding='utf-8')
          '@ | python -

      - name: Verify hotfix contract
        shell: pwsh
        run: |
          node --check web/first-run.js
          node --check web/sleepsync-hydration-v529.js
          python -m pytest -q tests/test_first_run_wizard_v5217_hotfix.py

      - name: Commit patched wizard
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/first-run.js web/first-run.css web/sleepsync-hydration-v529.js tests/test_first_run_wizard_v5217_hotfix.py
          git commit -m 'fix(onboarding): make wizard globally scrollable and desktop-focused'
          git push origin HEAD:installer-wizard
