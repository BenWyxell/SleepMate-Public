name: v5.3.4 one-shot packaged O2 depth acceptance

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply packaged O2 browser depth patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/v534_browser_depth_patch.py
          python -m py_compile scripts/v534_browser_acceptance.py
          python -c "from pathlib import Path; t=Path('scripts/v534_browser_acceptance.py').read_text(encoding='utf-8'); markers=['dailyDay,daily,batchRows,dayCalls:0,invalidationHandlers:[],canvasText:[]',\"f.emitInvalidation('sleepsync-completed')\",'hover_canvas(page, \\\"o2rDayDual\\\", (\\\"SpO₂\\\", \\\"Pulzus\\\"))','hover_canvas(page, \\\"smO2FocusDual\\\", (\\\"SpO₂\\\", \\\"Pulzus\\\"))','hover_canvas(page, \\\"smStackO2DualCanvas\\\", (\\\"SpO₂\\\", \\\"Pulzus\\\"))','hover_canvas(page, \\\"smDashO2Trend\\\", (\\\"SpO₂\\\",))',\"localStorage.getItem('sm-o2-overlay:flow')\",'Focus zoom was not preserved across mode switching']; missing=[m for m in markers if m not in t]; assert not missing, missing"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v534-browser-depth-migration.yml .github/v534_browser_depth_patch.py
          git add scripts/v534_browser_acceptance.py
          git diff --cached --check
          git commit -m 'Exercise daily O2 charts and SleepSync invalidation in packaged Edge'
          git push origin HEAD:v5.3.4-o2-full-refactor
