name: Apply v5.3.5 round 1 polish

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/_v535_round1_patch.py
      - .github/workflows/_v535_round1_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply requested fixes
        run: python scripts/_v535_round1_patch.py
      - name: Validate syntax and focused contracts
        run: |
          set -euo pipefail
          python -m py_compile cpap/oximetry.py cpap/o2ring_runtime_v534.py build/windows/SleepMate.spec
          node --check web/o2ring.js
          node --check web/frontend-v534.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_polish_contract.py tests/test_v534_packaging_acceptance.py tests/test_o2ring_v534_release_contract.py
          git diff --check
      - name: Commit product fixes and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_v535_round1_patch.py .github/workflows/_v535_round1_patch.yml
          git add cpap/oximetry.py web/o2ring.js web/frontend-v534.js web/index.html web/o2ring-v534.css build/windows/SleepMate.spec tests/test_v534_packaging_acceptance.py tests/test_v535_polish_contract.py
          git commit -m 'Fix O2 medians reports latest sleep and night card'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
