name: Publish SleepMate 5.3.11 once

on:
  push:
    branches:
      - release-v5.3.11-helper

permissions:
  contents: write
  actions: write

concurrency:
  group: sleepmate-v5.3.11-one-shot-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      VERSION: 5.3.11
      TAG: v5.3.11
      SOURCE_BRANCH: release-v5.3.11-source
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout publication helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize exact 5.3.11 release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH"
          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          version_file = Path('cpap/version.py')
          text = version_file.read_text(encoding='utf-8')
          old = 'APP_VERSION = "5.3.10"'
          new = 'APP_VERSION = "5.3.11"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected APP_VERSION source state')
          version_file.write_text(text, encoding='utf-8')

          for path in (Path('web/service-worker.js'), Path('web/service-worker-v508-base.js')):
              sw = path.read_text(encoding='utf-8')
              sw = sw.replace("sleepmate-shell-v5.3.10-o2-hydration-1", "sleepmate-shell-v5.3.11-o2-hydration-1")
              sw = sw.replace("active caches are v5.3.9:", "active shell cache is v5.3.11; API cache compatibility remains v5.3.9:")
              path.write_text(sw, encoding='utf-8')

          for path in Path('tests').rglob('*.py'):
              test = path.read_text(encoding='utf-8')
              if '5.3.10' in test:
                  path.write_text(test.replace('5.3.10', '5.3.11'), encoding='utf-8')

          patch_file = Path('cpap/v530_features.py')
          patch = patch_file.read_text(encoding='utf-8')
          marker = '    text = _replace_required(text, old_draw, new_draw, "Dashboard O2 AHI-style renderer")\n\n'
          if 'Dashboard O2 AHI-style layout' not in patch:
              if marker not in patch:
                  raise SystemExit('Dashboard O2 renderer marker missing')
              addition = '''    old_section = """function ensureDashboardO2Section(){const agg=q('#dashboardOverviewView .aggregate-cards');if(!agg)return null;let sec=id('smDashboardO2V534');if(!sec){sec=document.createElement('section');sec.id='smDashboardO2V534';sec.className='panel sm-dashboard-o2-v534';sec.dataset.o2ringFeature='1';sec.innerHTML='<div class="panel-head"><div><h3>Oximetriai összegzés</h3><span>CPAP-idővel átfedő O2Ring-adatok.</span></div><button id="smDashO2Open">Oximetria →</button></div><div class="sm-dashboard-o2-cards"><div><span>Medián SpO₂</span><b id="smDashO2Avg">—</b></div><div><span>Minimum SpO₂</span><b id="smDashO2Min">—</b></div><div><span>Medián pulzus</span><b id="smDashHrAvg">—</b></div><div><span>Átlag T90</span><b id="smDashT90">—</b></div></div><div class="sm-dashboard-o2-mini"><article><header>SpO₂ trend</header><div class="sm-o2-chart-wrap"><canvas id="smDashO2Trend"></canvas></div></article><article><header>Pulzus trend</header><div class="sm-o2-chart-wrap"><canvas id="smDashHrTrend"></canvas></div></article></div><div id="smDashO2Empty" class="o2r-empty hidden">Ebben az időszakban még nincs illesztett O2Ring adat.</div>';agg.insertAdjacentElement('afterend',sec);id('smDashO2Open').onclick=()=>openOximetry('recordings')}return sec}"""
    new_section = """function ensureDashboardO2Section(){const agg=q('#dashboardOverviewView .aggregate-cards');if(!agg)return null;let sec=id('smDashboardO2V534');if(!sec){sec=document.createElement('section');sec.id='smDashboardO2V534';sec.className='sm-dashboard-o2-v534';sec.dataset.o2ringFeature='1';sec.innerHTML=`<section class="panel sm-dashboard-o2-summary"><div class="panel-head"><div><h3>Oximetriai összegzés</h3><span>CPAP-idővel átfedő O2Ring-adatok.</span></div><button id="smDashO2Open">Oximetria →</button></div><div class="sm-dashboard-o2-cards"><div><span>Medián SpO₂</span><b id="smDashO2Avg">—</b></div><div><span>Minimum SpO₂</span><b id="smDashO2Min">—</b></div><div><span>Medián pulzus</span><b id="smDashHrAvg">—</b></div><div><span>Átlag T90</span><b id="smDashT90">—</b></div><div id="smDashO2Empty" class="o2r-empty hidden">Ebben az időszakban még nincs illesztett O2Ring adat.</div></div></section><section class="trend-grid sm-dashboard-o2-trends"><article class="panel trend-card"><div class="panel-head"><h3>SpO₂ trend</h3><span>medián</span></div><canvas id="smDashO2Trend"></canvas></article><article class="panel trend-card"><div class="panel-head"><h3>Pulzus trend</h3><span>medián bpm</span></div><canvas id="smDashHrTrend"></canvas></article></section>`;agg.insertAdjacentElement('afterend',sec);id('smDashO2Open').onclick=()=>openOximetry('recordings')}return sec}"""
    text = _replace_required(text, old_section, new_section, "Dashboard O2 AHI-style layout")

'''
              patch = patch.replace(marker, marker + addition, 1)
          patch_file.write_text(patch, encoding='utf-8')

          release_note = Path('release-notes/v5.3.11.md')
          latest = release_note.read_text(encoding='utf-8').rstrip()
          if not latest.startswith('# SleepMate 5.3.11\n'):
              raise SystemExit('Unexpected v5.3.11 release note header')
          if 'Release build: **5.3.11**.' not in latest or 'Kiadási csatorna: **stable**.' not in latest:
              raise SystemExit('Missing v5.3.11 release identity markers')

          notes = Path('RELEASE_NOTES.md')
          current = notes.read_text(encoding='utf-8')
          if current.startswith('# SleepMate 5.3.11\n'):
              _, sep, rest = current.partition('\n---\n')
              notes.write_text(latest + ('\n\n---\n' + rest if sep else '\n'), encoding='utf-8')
          else:
              notes.write_text(latest + '\n\n---\n' + current, encoding='utf-8')
          PY

          python -m pytest -q tests/test_v5311_pwa_o2_recovery.py tests/test_v5311_dashboard_layout.py

          git add cpap/version.py cpap/v530_features.py web/service-worker.js web/service-worker-v508-base.js RELEASE_NOTES.md release-notes/v5.3.11.md tests
          if ! git diff --cached --quiet; then
            git commit -m "Finalize SleepMate 5.3.11 PWA O2 recovery release"
            git push origin "$SOURCE_BRANCH"
          fi

          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          [[ "$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')" == "$VERSION" ]]
          grep -Fq "const CACHE='sleepmate-shell-v${VERSION}-o2-hydration-1';" web/service-worker.js
          grep -Fq "const CACHE='sleepmate-shell-v${VERSION}-o2-hydration-1';" web/service-worker-v508-base.js
          grep -Fq "Dashboard O2 AHI-style layout" cpap/v530_features.py
          grep -Fq "# SleepMate ${VERSION}" RELEASE_NOTES.md
          echo "Release source: $TARGET_SHA"

      - name: Build and fully verify exact release source
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          [[ "$ACTUAL" == "$TARGET_SHA" ]] || { echo "Release source moved: $ACTUAL" >&2; exit 1; }

          gh workflow run windows-release.yml --ref "$SOURCE_BRANCH"
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID="$(gh run list --workflow windows-release.yml --branch "$SOURCE_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo 'Dispatched verification run was not found.' >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status

      - name: Download VERIFIED release artifact
        shell: bash
        env:
          RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir -p release-staging
          gh run download "$RUN_ID" --name SleepMate-Windows-x64-VERIFIED-RELEASE --dir release-staging
          cd release-staging
          sha256sum -c SHA256SUMS.txt
          test -s "SleepMate_Setup_v${VERSION}.msi"
          test -s "SleepMate_Setup_v${VERSION}.msi.sha256"
          test -s "SleepMate_v${VERSION}_windows_x64.zip"
          test -s sleepmate-update.json
          test -s release-metadata.json

      - name: Create, verify and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SleepMate ${VERSION} — PWA O2 helyreállítás és Dashboard trendek"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish >/tmp/existing.json 2>/dev/null; then
            DRAFT="$(jq -r '.isDraft' /tmp/existing.json)"
            TARGET="$(jq -r '.targetCommitish' /tmp/existing.json)"
            [[ "$TARGET" == "$TARGET_SHA" ]] || { echo "Existing $TAG targets $TARGET, expected $TARGET_SHA" >&2; exit 1; }
            if [[ "$DRAFT" == 'false' ]]; then
              echo "$TAG is already published from the expected commit."
              exit 0
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "release-notes/v${VERSION}.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "$TITLE" --notes-file "release-notes/v${VERSION}.md" --draft
          fi

          gh release upload "$TAG" release-staging/* --repo "$GITHUB_REPOSITORY" --clobber

          mapfile -t actual < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=(
            SHA256SUMS.txt
            "SleepMate_Setup_v${VERSION}.msi"
            "SleepMate_Setup_v${VERSION}.msi.sha256"
            "SleepMate_v${VERSION}_windows_x64.zip"
            build-msi-toolchain.txt
            msi-inventory.txt
            release-metadata.json
            sleepmate-update.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]] || {
            echo 'Release asset set mismatch.' >&2
            printf 'actual: %s\n' "${actual[*]}" >&2
            printf 'expected: %s\n' "${expected_sorted[*]}" >&2
            exit 1
          }

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish,url > /tmp/published.json
          [[ "$(jq -r '.isDraft' /tmp/published.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/published.json)" == 'false' ]]
          [[ "$(jq -r '.tagName' /tmp/published.json)" == "$TAG" ]]
          [[ "$(jq -r '.targetCommitish' /tmp/published.json)" == "$TARGET_SHA" ]]
          cat /tmp/published.json

      - name: Advance stable and next fixes branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin
          git push origin "$TARGET_SHA:refs/heads/v5.3.5-stable-base"
          if gh api "repos/$GITHUB_REPOSITORY/branches/v5.3.11-fixes" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/v5.3.11-fixes" -f sha="$TARGET_SHA" -F force=false >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/v5.3.11-fixes' -f sha="$TARGET_SHA" >/dev/null
          fi
