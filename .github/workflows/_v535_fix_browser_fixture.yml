name: Fix v5.3.5 browser acceptance fixture

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/_v535_fix_browser_fixture.py
      - .github/workflows/_v535_fix_browser_fixture.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply browser fixture fix
        run: python scripts/_v535_fix_browser_fixture.py
      - name: Validate fixture and focused contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_user_acceptance_matrix.py tests/test_v534_first_load_observer_guard.py
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/v534_browser_acceptance.py').read_text(encoding='utf-8')
          assert s.count('const liveRows = [') == 1
          PY
          git diff --check
      - name: Commit fix and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_v535_fix_browser_fixture.py .github/workflows/_v535_fix_browser_fixture.yml
          git add scripts/v534_browser_acceptance.py tests/test_v535_user_acceptance_matrix.py
          git commit -m 'Fix v5.3.5 Edge acceptance fixture declaration'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
