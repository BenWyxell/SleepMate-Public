name: v5.3.4 one-shot peer mode and flash migration

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix persistent daily peer modes and add flash acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_v534_peer_mode_flash.py
          python -m py_compile scripts/v534_browser_acceptance.py
          node --check web/o2ring.js
          grep -F 'smDailyModeSwitchHost' web/o2ring.js
          grep -F 'daily peer-mode controls disappeared after entering Oximetria' scripts/v534_browser_acceptance.py
          grep -F 'latest-session card flashed legacy Befejezve during first boot' scripts/v534_browser_acceptance.py
          grep -F 'latest-session card flashed legacy Befejezve during stale-cache recovery' scripts/v534_browser_acceptance.py
          rm scripts/_tmp_v534_peer_mode_flash.py
          rm .github/workflows/v534-peer-mode-flash-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/o2ring.js web/o2ring-v534.css scripts/v534_browser_acceptance.py scripts/_tmp_v534_peer_mode_flash.py .github/workflows/v534-peer-mode-flash-migration.yml
          git diff --cached --check
          git commit -m "Keep daily peer modes visible and guard session status flashes"
          git push origin HEAD:v5.3.4-o2-full-refactor
