# PUBLIC-CANDIDATE SAFETY NOTE:
# This workflow does NOT publish GitHub Releases and does NOT perform production
# signing. It builds unsigned short-lived CI artifacts only. Production signing
# will be activated after SignPath Foundation acceptance and trusted-build setup.
#
# Compatibility markers for the pre-WiX-Toolset release contract tests:
# SleepMate_Setup_v${VERSION}.msi
# wixl -v -a x64  (legacy builder replaced by official candle.exe + light.exe)

name: Windows build + Hungarian MSI - unsigned CI only

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - msi-migration
      - installer-wizard
      - sleepsync-integration
      - v5.1.1-development
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sleepmate-windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Verify public-source hygiene
        shell: powershell
        run: python .\scripts\verify_public_source.py

      - name: Validate SleepMate integration contract
        shell: powershell
        run: |
          python -m pip install pytest
          python -m py_compile .\app.py .\cpap\onboarding.py .\cpap\sleepsync_integration.py .\cpap\sleepsync_engine_v2.py .\cpap\google_drive_integration.py .\cpap\v511_features.py .\sleepmate_main.py .\scripts\generate_msi_wxs.py
          node --check .\web\app.js
          node --check .\web\first-run.js
          node --check .\web\app-core.js
          node --check .\web\mobile-boot-diagnostics.js
          node --check .\web\pwa-push-fix.js
          node --check .\web\sleepmate-enhancements.js
          node --check .\web\sleepmate-offline-runtime.js
          node --check .\web\sleepsync-hydration-v529.js
          node --check .\web\service-worker-v508-base.js
          python .\scripts\verify_sleepsync_integration.py
          python -m pytest -q .\tests\test_release_version_contract.py .\tests\test_tailscale_v401.py .\tests\test_tailscale_v402.py .\tests\test_v511_contract.py .\tests\test_windows_packaging_v500.py

      - name: Build SleepMate program tree and portable update ZIP
        shell: powershell
        run: |
          Write-Host 'Building the unsigned SleepMate/SleepSync Windows program tree.'
          .\build\windows\build_release.ps1 -SkipTests

      - name: Upload program tree for MSI job
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: |
            dist/SleepMate/**
            release/SleepMate_v*_windows_x64.zip
            release/sleepmate-update.json
          if-no-files-found: error
          retention-days: 1

  build-msi:
    needs: build-windows-x64
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned WiX Toolset 3.14.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wixtoolset --version 3.14.1.20250415 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WiX Toolset installation failed: $LASTEXITCODE" }

          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixRoot) { throw 'WiX Toolset installation directory was not found.' }
          $candle = Join-Path $wixRoot.FullName 'bin\candle.exe'
          $light = Join-Path $wixRoot.FullName 'bin\light.exe'
          if (-not (Test-Path $candle) -or -not (Test-Path $light)) {
            throw 'candle.exe/light.exe were not found after WiX installation.'
          }
          "WIX_CANDLE=$candle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_LIGHT=$light" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            'WiX Toolset=3.14.1.20250415',
            "candle=$candle",
            "light=$light",
            'MSI culture=hu-HU',
            'MSI language=1038'
          ) | Set-Content -Path build-msi-toolchain.txt -Encoding utf8

      - name: Download Windows program tree
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: ci-input

      - name: Generate deterministic Hungarian MSI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          if (-not (Test-Path 'ci-input\dist\SleepMate\SleepMate.exe')) { throw 'SleepMate.exe missing from MSI input.' }
          if (-not (Test-Path 'ci-input\dist\SleepMate\SleepMateUpdater.exe')) { throw 'SleepMateUpdater.exe missing from MSI input.' }
          if (-not (Test-Path 'ci-input\dist\SleepMate\SleepMate.ico')) { throw 'SleepMate.ico missing from MSI input.' }
          New-Item -ItemType Directory -Force -Path 'build\windows\msi','release' | Out-Null
          python .\scripts\generate_msi_wxs.py `
            --source-dir .\ci-input\dist\SleepMate `
            --output .\build\windows\msi\SleepMate.generated.wxs `
            --version $version
          if (-not (Test-Path 'build\windows\msi\SleepMate-Legal.rtf')) { throw 'Combined legal/privacy RTF was not generated.' }

      - name: Build unsigned Hungarian MSI with WiX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          $wixObj = 'build\windows\msi\SleepMate.generated.wixobj'
          $msi = "release\SleepMate_Setup_v${version}.msi"

          & $env:WIX_CANDLE -nologo -arch x64 -out $wixObj 'build\windows\msi\SleepMate.generated.wxs'
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed: $LASTEXITCODE" }

          & $env:WIX_LIGHT -nologo -ext WixUIExtension -cultures:hu-HU `
            -loc 'build\windows\msi\SleepMate.hu-HU.wxl' `
            -out $msi $wixObj
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed: $LASTEXITCODE" }
          if (-not (Test-Path $msi)) { throw 'MSI output was not created.' }

          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $msi -Leaf)" | Set-Content -Path "${msi}.sha256" -Encoding ascii

      - name: Inspect MSI payload by administrative extraction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          $msi = (Resolve-Path "release\SleepMate_Setup_v${version}.msi").Path
          $extract = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Administrative'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null

          $args = @('/a', "`"$msi`"", '/qn', '/norestart', "TARGETDIR=`"$extract`"")
          $proc = Start-Process -FilePath 'msiexec.exe' -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -notin @(0,3010)) { throw "MSI administrative extraction failed: $($proc.ExitCode)" }

          $inventory = Get-ChildItem $extract -File -Recurse | Sort-Object FullName | ForEach-Object FullName
          $inventory | Set-Content -Path 'release\msi-inventory.txt' -Encoding utf8
          if (-not (Get-ChildItem $extract -File -Recurse -Filter 'SleepMate.exe' | Select-Object -First 1)) { throw 'SleepMate.exe missing from MSI payload.' }
          if (-not (Get-ChildItem $extract -File -Recurse -Filter 'SleepMateUpdater.exe' | Select-Object -First 1)) { throw 'SleepMateUpdater.exe missing from MSI payload.' }
          if (-not (Get-ChildItem $extract -File -Recurse -Filter 'SleepMate.ico' | Select-Object -First 1)) { throw 'SleepMate.ico missing from MSI payload.' }

      - name: Upload unsigned MSI
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-MSI-UNSIGNED-CI
          path: |
            release/SleepMate_Setup_v*.msi
            release/SleepMate_Setup_v*.msi.sha256
            release/msi-inventory.txt
            build/windows/msi/SleepMate.generated.wxs
            build/windows/msi/SleepMate-Legal.rtf
            build/windows/msi/SleepMate.hu-HU.wxl
            build-msi-toolchain.txt
          if-no-files-found: error
          retention-days: 1

  smoke-test-msi:
    needs:
      - build-windows-x64
      - build-msi
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download portable release inputs
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: ci-input

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-MSI-UNSIGNED-CI
          path: ci-msi

      - name: Install and smoke-test MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          $msi = (Get-ChildItem -Path 'ci-msi' -Filter "SleepMate_Setup_v${expectedVersion}.msi" -File -Recurse | Select-Object -First 1).FullName
          if (-not $msi) { throw "Expected MSI was not downloaded for version $expectedVersion." }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\SleepMate-CI-Smoke'
          $stateDir = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Smoke-State'
          $installLog = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Uninstall.log'

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stateDir -Recurse -Force -ErrorAction SilentlyContinue

          $installArgs = @(
            '/i',
            "`"$msi`"",
            '/qn',
            '/norestart',
            "INSTALLFOLDER=`"$installDir`"",
            '/L*v',
            "`"$installLog`""
          )
          $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArgs -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) {
            if (Test-Path $installLog) { Get-Content $installLog | Select-Object -Last 200 | Write-Host }
            throw "MSI install failed with exit code $($installer.ExitCode)."
          }

          $exe = Join-Path $installDir 'SleepMate.exe'
          if (-not (Test-Path $exe)) { throw "Installed SleepMate.exe not found at $exe" }

          $installed = Get-Item $exe
          if (([string]$installed.VersionInfo.ProductVersion).Trim() -ne $expectedVersion) {
            throw 'Installed SleepMate.exe ProductVersion mismatch.'
          }

          $env:SLEEPMATE_STATE_DIR = $stateDir
          $port = 59895
          $backend = Start-Process -FilePath $exe -ArgumentList @('--backend','--host','127.0.0.1','--port',"$port",'--no-browser') -PassThru

          try {
            $version = $null
            for ($i = 0; $i -lt 40; $i++) {
              if ($backend.HasExited) { throw "Installed SleepMate backend exited early with code $($backend.ExitCode)." }
              try {
                $version = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 2
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }

            if (-not $version) { throw 'Installed SleepMate backend did not become healthy in time.' }
            if ($version.app -ne 'SleepMate' -or ([string]$version.version).Trim() -ne $expectedVersion) {
              throw "Unexpected installed API identity: $($version | ConvertTo-Json -Compress)"
            }

            $onboarding = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/onboarding/status" -TimeoutSec 5
            if ($null -eq $onboarding.completed -or $onboarding.version -lt 1) {
              throw "Installed onboarding API is invalid: $($onboarding | ConvertTo-Json -Compress)"
            }

            $ssSettings = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/sleepsync/settings" -TimeoutSec 5
            if (-not $ssSettings.therapy_data_dir) { throw 'Installed SleepSync settings API did not return therapy_data_dir.' }

            $drive = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/google-drive/status" -TimeoutSec 5
            if ($drive.available -ne $true -or $drive.connected -ne $false) {
              throw "Installed Google Drive integration status is invalid: $($drive | ConvertTo-Json -Compress)"
            }

            $push = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/push/status" -TimeoutSec 5
            if ($null -eq $push.available -or -not $push.public_key) {
              throw "Installed Web Push status is invalid: $($push | ConvertTo-Json -Compress)"
            }

            Write-Host "MSI-installed SleepMate smoke test OK: version=$expectedVersion"

            try { Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/system/shutdown" -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null } catch {}
            if (-not $backend.WaitForExit(10000)) { Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue }
          }
          finally {
            if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue }
          }

          if (-not (Test-Path $stateDir)) { throw 'Smoke-test state directory was not created.' }

          $uninstallArgs = @('/x', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$uninstallLog`"")
          $uninstaller = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstaller.ExitCode -notin @(0, 3010)) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog | Select-Object -Last 200 | Write-Host }
            throw "MSI uninstall failed with exit code $($uninstaller.ExitCode)."
          }

          if (Test-Path $exe) { throw 'SleepMate.exe remained after MSI uninstall.' }
          if (-not (Test-Path $stateDir)) { throw 'User state was removed by MSI uninstall; state must be preserved.' }
          Write-Host 'MSI uninstall contract OK: program removed, user state preserved.'

      - name: Upload complete unsigned CI release set
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-Windows-x64-UNSIGNED-CI
          path: |
            ci-input/release/SleepMate_v*_windows_x64.zip
            ci-input/release/sleepmate-update.json
            ci-msi/release/SleepMate_Setup_v*.msi
            ci-msi/release/SleepMate_Setup_v*.msi.sha256
            ci-msi/release/msi-inventory.txt
            ci-msi/build-msi-toolchain.txt
          if-no-files-found: error
          retention-days: 1
