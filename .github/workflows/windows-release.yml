# PUBLIC-CANDIDATE SAFETY NOTE:
# This workflow builds unsigned Windows artifacts. For SleepMate 5.2.16 only,
# a final job may publish an intentionally unsigned public MSI candidate after
# the complete build/install/runtime/uninstall smoke-test chain succeeds.
# Production signing remains disabled until SignPath Foundation acceptance and
# trusted-build configuration.

name: Windows build + MSI - unsigned CI only

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - msi-migration
      - sleepsync-integration
      - v5.1.1-development
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sleepmate-windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Verify public-source hygiene
        shell: powershell
        run: python .\scripts\verify_public_source.py

      - name: Validate SleepMate integration contract
        shell: powershell
        run: |
          python -m pip install pytest
          python -m py_compile .\app.py .\cpap\sleepsync_integration.py .\cpap\sleepsync_engine_v2.py .\cpap\google_drive_integration.py .\cpap\v511_features.py .\sleepmate_main.py .\scripts\generate_msi_wxs.py
          node --check .\web\app.js
          node --check .\web\app-core.js
          node --check .\web\mobile-boot-diagnostics.js
          node --check .\web\pwa-push-fix.js
          node --check .\web\sleepmate-enhancements.js
          node --check .\web\sleepmate-offline-runtime.js
          node --check .\web\service-worker-v508-base.js
          python .\scripts\verify_sleepsync_integration.py
          python -m pytest -q .\tests\test_release_version_contract.py .\tests\test_tailscale_v401.py .\tests\test_tailscale_v402.py .\tests\test_v511_contract.py .\tests\test_windows_packaging_v500.py

      - name: Build SleepMate program tree and portable update ZIP
        shell: powershell
        run: |
          Write-Host 'Building the unsigned SleepMate/SleepSync Windows program tree.'
          .\build\windows\build_release.ps1 -SkipTests

      - name: Upload program tree for MSI job
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: |
            dist/SleepMate/**
            release/SleepMate_v*_windows_x64.zip
            release/sleepmate-update.json
          if-no-files-found: error
          retention-days: 1

  build-msi:
    needs: build-windows-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install GNOME msitools and wixl
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y msitools wixl
          wixl --version
          msiextract --help >/dev/null
          dpkg-query -W -f='${Package}=${Version}\n' msitools wixl wixl-data | sort | tee build-msi-toolchain.txt

      - name: Download Windows program tree
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: ci-input

      - name: Generate deterministic MSI source
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          test -f ci-input/dist/SleepMate/SleepMate.exe
          test -f ci-input/dist/SleepMate/SleepMateUpdater.exe
          test -f ci-input/dist/SleepMate/SleepMate.ico
          mkdir -p build/windows/msi release
          python scripts/generate_msi_wxs.py \
            --source-dir ci-input/dist/SleepMate \
            --output build/windows/msi/SleepMate.generated.wxs \
            --version "$VERSION"

      - name: Build unsigned MSI with wixl
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          MSI="release/SleepMate_Setup_v${VERSION}.msi"
          wixl -v -a x64 -o "$MSI" build/windows/msi/SleepMate.generated.wxs
          test -s "$MSI"
          sha256sum "$MSI" | tee "${MSI}.sha256"

      - name: Inspect MSI payload
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          MSI="release/SleepMate_Setup_v${VERSION}.msi"
          rm -rf msi-extracted
          mkdir -p msi-extracted
          msiextract -C msi-extracted "$MSI"
          find msi-extracted -type f -print | sort | tee release/msi-inventory.txt
          test -n "$(find msi-extracted -type f -name SleepMate.exe -print -quit)"
          test -n "$(find msi-extracted -type f -name SleepMateUpdater.exe -print -quit)"
          test -n "$(find msi-extracted -type f -name SleepMate.ico -print -quit)"

      - name: Upload unsigned MSI
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-MSI-UNSIGNED-CI
          path: |
            release/SleepMate_Setup_v*.msi
            release/SleepMate_Setup_v*.msi.sha256
            release/msi-inventory.txt
            build/windows/msi/SleepMate.generated.wxs
            build-msi-toolchain.txt
          if-no-files-found: error
          retention-days: 1

  smoke-test-msi:
    needs:
      - build-windows-x64
      - build-msi
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download portable release inputs
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: ci-input

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-MSI-UNSIGNED-CI
          path: ci-msi

      - name: Install and smoke-test MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          $msi = (Get-ChildItem -Path 'ci-msi' -Filter "SleepMate_Setup_v${expectedVersion}.msi" -File -Recurse | Select-Object -First 1).FullName
          if (-not $msi) { throw "Expected MSI was not downloaded for version $expectedVersion." }

          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\SleepMate-CI-Smoke'
          $stateDir = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Smoke-State'
          $installLog = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'SleepMate-MSI-Uninstall.log'

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $stateDir -Recurse -Force -ErrorAction SilentlyContinue

          $installArgs = @(
            '/i',
            "`"$msi`"",
            '/qn',
            '/norestart',
            "INSTALLFOLDER=`"$installDir`"",
            'DESKTOP_SHORTCUT=0',
            'START_WITH_WINDOWS=0',
            '/L*v',
            "`"$installLog`""
          )
          $installer = Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArgs -Wait -PassThru
          if ($installer.ExitCode -notin @(0, 3010)) {
            if (Test-Path $installLog) { Get-Content $installLog | Select-Object -Last 200 | Write-Host }
            throw "MSI install failed with exit code $($installer.ExitCode)."
          }

          $exe = Join-Path $installDir 'SleepMate.exe'
          if (-not (Test-Path $exe)) { throw "Installed SleepMate.exe not found at $exe" }

          $installed = Get-Item $exe
          if (([string]$installed.VersionInfo.ProductVersion).Trim() -ne $expectedVersion) {
            throw 'Installed SleepMate.exe ProductVersion mismatch.'
          }

          $env:SLEEPMATE_STATE_DIR = $stateDir
          $port = 59895
          $backend = Start-Process -FilePath $exe -ArgumentList @('--backend','--host','127.0.0.1','--port',"$port",'--no-browser') -PassThru

          try {
            $version = $null
            for ($i = 0; $i -lt 40; $i++) {
              if ($backend.HasExited) {
                throw "Installed SleepMate backend exited early with code $($backend.ExitCode)."
              }
              try {
                $version = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $version) { throw 'Installed SleepMate backend did not become healthy in time.' }
            if ($version.app -ne 'SleepMate' -or ([string]$version.version).Trim() -ne $expectedVersion) {
              throw "Unexpected installed API identity: $($version | ConvertTo-Json -Compress)"
            }

            $ssSettings = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/sleepsync/settings" -TimeoutSec 5
            if (-not $ssSettings.therapy_data_dir) {
              throw 'Installed SleepSync settings API did not return therapy_data_dir.'
            }

            $drive = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/google-drive/status" -TimeoutSec 5
            if ($drive.available -ne $true -or $drive.connected -ne $false) {
              throw "Installed Google Drive integration status is invalid: $($drive | ConvertTo-Json -Compress)"
            }

            $push = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/push/status" -TimeoutSec 5
            if ($null -eq $push.available -or -not $push.public_key) {
              throw "Installed Web Push status is invalid: $($push | ConvertTo-Json -Compress)"
            }

            Write-Host "MSI-installed SleepMate smoke test OK: version=$expectedVersion"

            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/system/shutdown" -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 5 | Out-Null
            } catch {}

            if (-not $backend.WaitForExit(10000)) {
              Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
            }
          }
          finally {
            if (-not $backend.HasExited) {
              Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Test-Path $stateDir)) {
            throw 'Smoke-test state directory was not created.'
          }

          $uninstallArgs = @(
            '/x',
            "`"$msi`"",
            '/qn',
            '/norestart',
            '/L*v',
            "`"$uninstallLog`""
          )
          $uninstaller = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstaller.ExitCode -notin @(0, 3010)) {
            if (Test-Path $uninstallLog) { Get-Content $uninstallLog | Select-Object -Last 200 | Write-Host }
            throw "MSI uninstall failed with exit code $($uninstaller.ExitCode)."
          }

          if (Test-Path $exe) {
            throw 'SleepMate.exe remained after MSI uninstall.'
          }
          if (-not (Test-Path $stateDir)) {
            throw 'User state was removed by MSI uninstall; state must be preserved.'
          }

          Write-Host 'MSI uninstall contract OK: program removed, user state preserved.'

      - name: Upload complete unsigned CI release set
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-Windows-x64-UNSIGNED-CI
          path: |
            ci-input/release/SleepMate_v*_windows_x64.zip
            ci-input/release/sleepmate-update.json
            ci-msi/release/SleepMate_Setup_v*.msi
            ci-msi/release/SleepMate_Setup_v*.msi.sha256
            ci-msi/release/msi-inventory.txt
            ci-msi/build-msi-toolchain.txt
          if-no-files-found: error
          retention-days: 1

  publish-unsigned-v5-2-16:
    needs: smoke-test-msi
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check one-time release target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          TAG="v${VERSION}"

          if [[ "$VERSION" != "5.2.16" ]]; then
            echo "This publisher is pinned to SleepMate 5.2.16; current version is $VERSION. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download exact smoke-tested release artifact
        if: steps.target.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-UNSIGNED-CI
          path: release-input

      - name: Validate and stage release files
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail

          find_one() {
            local pattern="$1"
            mapfile -t found < <(find release-input -type f -name "$pattern" -print | sort)
            if [[ "${#found[@]}" -ne 1 ]]; then
              echo "Expected exactly one file matching $pattern, found ${#found[@]}." >&2
              printf '%s\n' "${found[@]:-}"
              exit 1
            fi
            printf '%s' "${found[0]}"
          }

          MSI="$(find_one "SleepMate_Setup_v${VERSION}.msi")"
          MSI_SHA="$(find_one "SleepMate_Setup_v${VERSION}.msi.sha256")"
          PORTABLE="$(find_one "SleepMate_v${VERSION}_windows_x64.zip")"
          MANIFEST="$(find_one "sleepmate-update.json")"
          INVENTORY="$(find_one "msi-inventory.txt")"
          TOOLCHAIN="$(find_one "build-msi-toolchain.txt")"

          EXPECTED_MSI_SHA="$(awk '{print $1; exit}' "$MSI_SHA")"
          ACTUAL_MSI_SHA="$(sha256sum "$MSI" | awk '{print $1}')"
          if [[ -z "$EXPECTED_MSI_SHA" || "$EXPECTED_MSI_SHA" != "$ACTUAL_MSI_SHA" ]]; then
            echo "MSI checksum verification failed." >&2
            echo "expected=$EXPECTED_MSI_SHA actual=$ACTUAL_MSI_SHA" >&2
            exit 1
          fi

          mkdir -p release-staging
          cp "$MSI" release-staging/
          cp "$MSI_SHA" release-staging/
          cp "$PORTABLE" release-staging/
          cp "$MANIFEST" release-staging/
          cp "$INVENTORY" release-staging/
          cp "$TOOLCHAIN" release-staging/

          (
            cd release-staging
            sha256sum \
              "SleepMate_Setup_v${VERSION}.msi" \
              "SleepMate_v${VERSION}_windows_x64.zip" \
              sleepmate-update.json \
              msi-inventory.txt \
              build-msi-toolchain.txt \
              > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          # SleepMate ${VERSION} — unsigned MSI candidate

          ## Magyar

          Ez a SleepMate első nyilvános, MSI-alapú Windows kiadási formája. A csomag szándékosan **nincs még Authenticode-dal aláírva**: ezt a kiadást azért publikáljuk, hogy a SignPath Foundation jelentkezés előtt a projekt már ugyanabban az MSI-alapú formában legyen nyilvánosan elérhető, amelyet később alá szeretnénk írni.

          A Windows ezért jelenleg SmartScreen vagy vírusvédelmi figyelmeztetést jeleníthet meg. Ez a kiadás nem állítja, hogy aláírt vagy megbízható kiadói tanúsítvánnyal rendelkezik.

          A fájlok kizárólag GitHub-hosted runnereken készültek a `${GITHUB_SHA}` commitból. A publikálás előtt sikeresen lefutott a public-source hygiene gate, a SleepMate integration/version contract, a Windows x64 program-tree build, a determinisztikus MSI build `wixl` használatával, az MSI payload inspection, az `msiexec` telepítési teszt, a telepített SleepMate runtime/API smoke tesztje és az `msiexec` eltávolítási teszt a felhasználói állapot megőrzésének ellenőrzésével.

          A `SHA256SUMS.txt` a publikált fő artifactok ellenőrzőösszegeit tartalmazza. Az `msi-inventory.txt` az MSI csomag tartalmának ellenőrzött listája, a `build-msi-toolchain.txt` pedig az MSI buildhez használt Ubuntu csomagverziókat rögzíti.

          **Fontos:** a SleepMate nem orvosi diagnosztikai szoftver, és nem helyettesíti az orvosi értékelést.

          ## English

          This is the first public MSI-based Windows release form of SleepMate. The package is intentionally **not Authenticode-signed yet**. It is published so that, before the SignPath Foundation application, the project already has a public release in the same MSI-based form that is intended to be signed later.

          Windows may therefore show SmartScreen or antivirus reputation warnings. This release does not claim to carry a trusted publisher signature.

          The files were produced exclusively on GitHub-hosted runners from commit `${GITHUB_SHA}`. Before publication, the public-source hygiene gate, SleepMate integration/version contract, Windows x64 program-tree build, deterministic MSI build with `wixl`, MSI payload inspection, `msiexec` installation test, runtime/API smoke test and `msiexec` uninstall test with user-state preservation all completed successfully.

          `SHA256SUMS.txt` contains checksums for the principal published artifacts. `msi-inventory.txt` records the inspected MSI payload and `build-msi-toolchain.txt` records the Ubuntu package versions used for MSI assembly.

          **Important:** SleepMate is not medical diagnostic software and does not replace professional medical evaluation.
          EOF

          sed -i 's/^          //' release-notes.md
          ls -lah release-staging
          cat release-staging/SHA256SUMS.txt

      - name: Publish GitHub Release v5.2.16
        if: steps.target.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            release-staging/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "SleepMate ${VERSION} — unsigned MSI candidate" \
            --notes-file release-notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
