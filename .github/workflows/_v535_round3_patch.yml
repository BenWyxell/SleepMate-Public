name: Apply v5.3.5 round 3 Oximetria layout

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/_v535_round3_patch.py
      - .github/workflows/_v535_round3_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Oximetria layout fixes
        run: python scripts/_v535_round3_patch.py
      - name: Validate UI contract
        run: |
          set -euo pipefail
          node --check web/o2ring.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_polish_contract.py
          git diff --check
      - name: Commit layout fixes and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_v535_round3_patch.py .github/workflows/_v535_round3_patch.yml
          git add web/o2ring.js web/o2ring.css web/o2ring-v534.css tests/test_v535_polish_contract.py
          git commit -m 'Unify Oximetria navigation and move status under search'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
