name: Apply v5.3.5 full 15-point user fixes

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/_v535_round3_patch.py
      - scripts/_v535_round3_prepare.py
      - .github/workflows/_v535_round3_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align patch with already-applied Oximetria layout
        run: python scripts/_v535_round3_prepare.py
      - name: Apply full user-fix patch
        run: python scripts/_v535_round3_patch.py
      - name: Validate syntax and all focused contracts
        run: |
          set -euo pipefail
          python -m py_compile cpap/oximetry.py cpap/o2ring_runtime_v534.py build/windows/SleepMate.spec scripts/v534_browser_acceptance.py scripts/v534_browser_acceptance_runner.py
          node --check web/o2ring.js
          node --check web/frontend-v534.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_v535_polish_contract.py \
            tests/test_v535_user_acceptance_matrix.py \
            tests/test_v534_acceptance_matrix.py \
            tests/test_v534_packaging_acceptance.py \
            tests/test_o2ring_v534_release_contract.py
          git diff --check
      - name: Commit product fixes and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_v535_round3_patch.py scripts/_v535_round3_prepare.py .github/workflows/_v535_round3_patch.yml
          git add web/o2ring.js web/o2ring-v534.css scripts/v534_browser_acceptance.py tests/test_v535_user_acceptance_matrix.py
          git commit -m 'Complete v5.3.5 15-point O2 UI acceptance'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
