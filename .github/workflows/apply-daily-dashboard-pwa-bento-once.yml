name: Apply daily Dashboard PWA bento once

on:
  push:
    branches:
      - daily-dashboard-pwa-bento-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixes branch
        uses: actions/checkout@v4
        with:
          ref: v5.3.13-fixes
          fetch-depth: 0

      - name: Apply phone PWA daily Dashboard bento redesign
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('web/dashboard-pwa-v5312.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Phone PWA daily detail bento extension */'
          if marker in css:
              raise SystemExit('Daily Dashboard bento extension already present; refusing duplicate append.')

          block = r'''

