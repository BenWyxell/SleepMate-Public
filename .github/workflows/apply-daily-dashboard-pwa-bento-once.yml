          css_path.write_text(css.rstrip() + block + '\n', encoding='utf-8')

          test = r'''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def read(path: str) -> str:
    return (ROOT / path).read_text(encoding="utf-8")


def test_phone_pwa_daily_dashboard_keeps_two_column_bento_layout():
    css = read("web/dashboard-pwa-v5312.css")
    assert "/* Phone PWA daily detail bento extension */" in css
    assert "#dashboardDailyView .daily-core-grid" in css
    assert "#dashboardDailyView .therapy-vitals" in css
    assert "#dashboardDailyView .overview-grid" in css
    assert css.count("grid-template-columns:repeat(2,minmax(0,1fr))!important") >= 8


def test_daily_bento_does_not_hide_existing_dashboard_data():
    css = read("web/dashboard-pwa-v5312.css")
    daily = css.split("/* Phone PWA daily detail bento extension */", 1)[1]
    assert "display:none" not in daily
    assert "visibility:hidden" not in daily
    assert "content-visibility:hidden" not in daily


def test_daily_bento_remains_scoped_to_installed_phone_pwa():
    css = read("web/dashboard-pwa-v5312.css")
    daily = css.split("/* Phone PWA daily detail bento extension */", 1)[1]
    selectors = [line.strip() for line in daily.splitlines() if line.strip().endswith("{") and not line.strip().startswith("@")]
    assert selectors
    assert all(line.startswith("html.sm-phone-pwa #page-dashboard #dashboardDailyView") for line in selectors)
'''
          Path('tests/test_pwa_dashboard_daily_bento.py').write_text(test, encoding='utf-8')

      - name: Run focused PWA Dashboard regressions
        run: python -m pytest -q tests/test_pwa_dashboard_packaging.py tests/test_pwa_dashboard_daily_bento.py

      - name: Commit and push fixes branch
        run: |
          git config user.name "BenWyxell"
          git config user.email "201330618+BenWyxell@users.noreply.github.com"
          git add web/dashboard-pwa-v5312.css tests/test_pwa_dashboard_daily_bento.py
          git commit -m "Redesign phone PWA daily Dashboard as compact bento"
          git push origin HEAD:v5.3.13-fixes
