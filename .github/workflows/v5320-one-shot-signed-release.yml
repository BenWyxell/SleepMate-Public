name: SleepMate 5.3.20 approved unsigned publisher

on:
  push:
    branches:
      - fix-v5.3.20-critical-regressions
    paths:
      - '.github/workflows/v5320-one-shot-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: sleepmate-v5.3.20-approved-unsigned-publish
  cancel-in-progress: false

env:
  VERSION: '5.3.20'
  SOURCE_SHA: '0661f5b742962f66237a6d3312a69bd446eaa72a'
  CANONICAL_RUN_ID: '34026337128'

jobs:
  publish-verified-unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Validate exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')" = "$VERSION"
          test -f release-notes/v5.3.20.md
          grep -F '# SleepMate 5.3.20' release-notes/v5.3.20.md

      - name: Refuse to overwrite existing v5.3.20
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; refusing to move or reuse it." >&2
            exit 1
          fi

      - name: Require successful canonical verification for exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANONICAL_RUN_ID" --jq '.status')"
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANONICAL_RUN_ID" --jq '.conclusion // ""')"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANONICAL_RUN_ID" --jq '.head_sha')"
          test "$STATUS" = 'completed'
          test "$CONCLUSION" = 'success'
          test "$SHA" = "$SOURCE_SHA"
          echo "Canonical verified run OK: $CANONICAL_RUN_ID @ $SHA"

      - name: Download canonical VERIFIED unsigned release set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir release-staging
          gh run download "$CANONICAL_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name SleepMate-Windows-x64-VERIFIED-RELEASE \
            --dir release-staging
          find release-staging -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Re-verify exact unsigned publication set
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-staging/SleepMate_Setup_v${VERSION}.msi"
          test -f "release-staging/SleepMate_Setup_v${VERSION}.msi.sha256"
          test -f "release-staging/SleepMate_v${VERSION}_windows_x64.zip"
          test -f release-staging/sleepmate-update.json
          test -f release-staging/release-metadata.json
          test -f release-staging/SHA256SUMS.txt
          test -f release-staging/msi-inventory.txt

          (
            cd release-staging
            sha256sum -c SHA256SUMS.txt
          )

          test "$(jq -r '.version' release-staging/release-metadata.json)" = "$VERSION"
          test "$(jq -r '.git_commit' release-staging/release-metadata.json)" = "$SOURCE_SHA"
          test "$(jq -r '.signed' release-staging/release-metadata.json)" = 'false'
          test "$(jq -r '.version' release-staging/sleepmate-update.json)" = "$VERSION"
          test "$(jq -r '.asset' release-staging/sleepmate-update.json)" = "SleepMate_Setup_v${VERSION}.msi"
          ! grep -Fq 'SleepMateUpdater.exe' release-staging/msi-inventory.txt

      - name: Prepare approved unsigned release notes
        shell: bash
        run: |
          cat > release-notes-approved.md <<'EOF'
          # SleepMate 5.3.20

          Célzott stabilitási kiadás a kritikus O2Ring/Oximetria, PWA-frissítési és Windows frissítési regressziók javításával. A saját `SleepMateUpdater.exe` komponens eltávolításra került; a frissítési folyamat MSI/Windows Installer alapú.

          A felület megjelenése és a terápiás számítások változatlanok.

          **Kiadási megjegyzés:** ez a kiadás a felhasználó kifejezett jóváhagyásával jelenleg SignPath/Authenticode aláírás nélkül kerül publikálásra. A publikált fájlok a teljes canonical Windows build, MSI telepítési/eltávolítási smoke teszt és release-integritás ellenőrzésen átment, pontosan ellenőrzött unsigned artifactok.
          EOF

      - name: Create draft v5.3.20 from verified unsigned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'SleepMate 5.3.20 — kritikus stabilitási javítások' \
            --notes-file release-notes-approved.md \
            --draft
          gh release upload "v$VERSION" release-staging/* --repo "$GITHUB_REPOSITORY"

      - name: Verify exact GitHub asset set and publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          LOCAL="$(find release-staging -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$REMOTE" != "$LOCAL" ]]; then
            echo 'GitHub Release assets differ from the verified publication set.' >&2
            diff -u <(printf '%s\n' "$LOCAL") <(printf '%s\n' "$REMOTE") || true
            exit 1
          fi
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,url
