name: Publish SleepMate 5.3.10 once

on:
  push:
    branches:
      - release-v5.3.10-helper
    paths:
      - .github/workflows/publish-v5310-once.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: release-v5.3.10-helper
          path: _helper

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: v5.3.9-fixes
          fetch-depth: 0
          path: source

      - name: Verify expected starting source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b1f6be3bc9e436ef8818e7a3ded371702847303c"

      - name: Apply targeted fixes
        working-directory: source
        shell: bash
        run: python ../_helper/scripts/v5310_release_helper_v2.py

      - name: Validate targeted fixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check web/first-run.js
          node --check web/o2ring.js
          python -m pip install -q pytest
          python -m pytest -q tests/test_v5310_targeted_fixes.py tests/test_o2ring_v534_release_contract.py
          python - <<'PY'
          from cpap.version import APP_VERSION, BUILD_CHANNEL
          assert APP_VERSION == '5.3.10'
          assert BUILD_CHANNEL == 'stable'
          PY

      - name: Commit exact 5.3.10 source
        id: source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cpap/version.py cpap/maintenance.py web/first-run.js web/first-run.css web/o2ring.js web/service-worker.js web/service-worker-v508-base.js tests/test_o2ring_v534_release_contract.py tests/test_v5310_targeted_fixes.py RELEASE_NOTES.md release-notes/v5.3.10.md
          git commit -m "Prepare SleepMate 5.3.10 targeted fixes"
          SOURCE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:v5.3.9-fixes
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch full Windows release verification
        id: release_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run windows-release.yml --repo "$GITHUB_REPOSITORY" --ref v5.3.9-fixes
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow windows-release.yml --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 5
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download verified release set
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.release_run.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-staging
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n SleepMate-Windows-x64-VERIFIED-RELEASE -D release-staging
          cd release-staging
          sha256sum -c SHA256SUMS.txt
          test -s SleepMate_Setup_v5.3.10.msi
          test -s sleepmate-update.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sleepmate-update.json').read_text(encoding='utf-8'))
          assert m['version']=='5.3.10'
          assert m['asset']=='SleepMate_Setup_v5.3.10.msi'
          assert m['package_type']=='windows-msi-x64'
          assert m['requires_installer'] is True
          PY

      - name: Publish stable v5.3.10 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view v5.3.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v5.3.10 already exists" >&2
            exit 1
          fi
          gh release create v5.3.10 release-staging/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "SleepMate 5.3.10 — Beállítási és O2Ring javítások" --notes-file source/release-notes/v5.3.10.md
          gh release view v5.3.10 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,url

      - name: Advance stable base and create next fixes branch
        working-directory: source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git push origin "$SOURCE_SHA:refs/heads/v5.3.5-stable-base"
          git push origin "$SOURCE_SHA:refs/heads/v5.3.10-fixes"
