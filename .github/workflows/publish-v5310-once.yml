              "if(x.measuring===true&&x.last_sample_ts&&(x.spo2!=null||x.heart_rate!=null)){mergeLive([{timestamp:x.last_sample_ts,spo2:x.spo2,heart_rate:x.heart_rate,motion:x.motion}]);scheduleLiveDraw()}",
