name: Apply request 05 Edge line-width acceptance fix

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/_v535_request05_edge_patch.py
      - .github/workflows/v535-request05-edge-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply request 05 acceptance correction
        run: python scripts/_v535_request05_edge_patch.py
      - name: Stage final clean release tree
        run: git rm scripts/_v535_request05_edge_patch.py .github/workflows/v535-request05-edge-patch.yml
      - name: Validate request 05 patch on final tree
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_v535_user_acceptance_matrix.py
          git diff --check
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v534_browser_acceptance.py tests/test_v535_user_acceptance_matrix.py
          git commit -m 'Fix request 05 Edge line-width acceptance comparison'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
