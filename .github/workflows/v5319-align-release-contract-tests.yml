name: v5.3.19 align release contract tests

on:
  push:
    branches:
      - release-v5.3.19-source
    paths:
      - '.github/workflows/v5319-align-release-contract-tests.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance only current-release assertions to v5.3.19
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_mobile_ai_push_v417.py'): [
                  ('sleepmate-shell-v5.3.18-o2-recovery-1', 'sleepmate-shell-v5.3.19-o2-updater-recovery-1'),
              ],
              Path('tests/test_o2ring_v532_release_contract.py'): [
                  ('APP_VERSION=="5.3.18"', 'APP_VERSION=="5.3.19"'),
              ],
              Path('tests/test_o2ring_v534_release_contract.py'): [
                  ('APP_VERSION == "5.3.18"', 'APP_VERSION == "5.3.19"'),
                  ('sleepmate-shell-v5.3.18-o2-recovery-1', 'sleepmate-shell-v5.3.19-o2-updater-recovery-1'),
              ],
              Path('tests/test_pwa_sleep_shell_v526.py'): [
                  ('sleepmate-shell-v5.3.18-o2-recovery-1', 'sleepmate-shell-v5.3.19-o2-updater-recovery-1'),
                  ('sleepmate-shell-v5.3.18', 'sleepmate-shell-v5.3.19'),
              ],
              Path('tests/test_v534_acceptance_matrix.py'): [
                  ('APP_VERSION == "5.3.18"', 'APP_VERSION == "5.3.19"'),
                  ('sleepmate-shell-v5.3.18-o2-recovery-1', 'sleepmate-shell-v5.3.19-o2-updater-recovery-1'),
              ],
              Path('tests/test_v537_targeted_fixes.py'): [
                  ('sleepmate-shell-v5.3.18-o2-recovery-1', 'sleepmate-shell-v5.3.19-o2-updater-recovery-1'),
                  (
                      'assert "updater-dist\\\\SleepMateUpdater\\\\SleepMateUpdater.exe" in release_build',
                      'assert "$StableUpdaterVersion = \'5.3.17\'" in release_build\n'
                      '    assert "$StableUpdaterExeSha256" in release_build\n'
                      '    assert "Invoke-WebRequest -Uri $StableUpdaterZipUrl" in release_build\n'
                      '    assert "Pinned updater hash mismatch" in release_build'
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected assertion in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_mobile_ai_push_v417.py \
            tests/test_o2ring_v532_release_contract.py \
            tests/test_o2ring_v534_release_contract.py \
            tests/test_pwa_sleep_shell_v526.py \
            tests/test_v534_acceptance_matrix.py \
            tests/test_v537_targeted_fixes.py \
            tests/test_v5319_o2_and_updater_regressions.py

      - name: Commit aligned contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_mobile_ai_push_v417.py \
            tests/test_o2ring_v532_release_contract.py \
            tests/test_o2ring_v534_release_contract.py \
            tests/test_pwa_sleep_shell_v526.py \
            tests/test_v534_acceptance_matrix.py \
            tests/test_v537_targeted_fixes.py
          git commit -m 'test(release): align current contracts with v5.3.19'
          git push origin "HEAD:$GITHUB_REF_NAME"
