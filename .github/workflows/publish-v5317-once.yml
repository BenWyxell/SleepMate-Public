name: Publish SleepMate 5.3.17 once

on:
  push:
    branches:
      - release-v5.3.17-helper

permissions:
  contents: write
  actions: write

concurrency:
  group: sleepmate-v5.3.17-one-shot-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      VERSION: 5.3.17
      PREVIOUS_VERSION: 5.3.16
      TAG: v5.3.17
      SOURCE_BRANCH: release-v5.3.17-source
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout publication helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize exact 5.3.17 release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH"
          git checkout -B "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          old = b"5.3.16"
          new = b"5.3.17"

          for name in (
              "cpap/version.py",
              "web/service-worker.js",
              "web/service-worker-v508-base.js",
          ):
              path = Path(name)
              data = path.read_bytes()
              if old in data:
                  path.write_bytes(data.replace(old, new))
              elif new not in data:
                  raise SystemExit(
                      f"Neither expected previous marker {old.decode()} nor final marker {new.decode()} exists in {name}"
                  )

          for path in Path("tests").glob("test_*.py"):
              data = path.read_bytes()
              if old in data:
                  path.write_bytes(data.replace(old, new))

          notes = Path("release-notes/v5.3.17.md").read_text(encoding="utf-8").rstrip() + "\n\n"
          release_notes = Path("RELEASE_NOTES.md")
          existing = release_notes.read_text(encoding="utf-8")
          header = "# SleepMate 5.3.17"
          if existing.startswith(header):
              next_section = existing.find("\n# SleepMate ", len(header))
              tail = existing[next_section + 1:] if next_section >= 0 else ""
              release_notes.write_text(notes + tail, encoding="utf-8")
          else:
              release_notes.write_text(notes + existing, encoding="utf-8")
          PY

          python -m py_compile cpap/v530_features.py cpap/version.py
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_v5317_pwa_generation_handover.py \
            tests/test_v537_targeted_fixes.py \
            tests/test_pwa_sleep_shell_v526.py \
            tests/test_o2ring_v534_release_contract.py \
            tests/test_v5315_pwa_daily_delivery_and_o2.py \
            tests/test_v5316_daily_o2_format_and_ahi_span.py

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finalize SleepMate 5.3.17 PWA generation recovery release"
            git push origin "$SOURCE_BRANCH"
          fi

          TARGET_SHA="$(git rev-parse HEAD)"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          [[ "$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')" == "$VERSION" ]]
          grep -Fq "const RELEASE_VERSION='${VERSION}';" web/service-worker.js
          grep -Fq "const BUILD_ID='${VERSION}';" web/service-worker.js
          grep -Fq "await self.clients.claim()" web/service-worker.js
          grep -Fq "SLEEPMATE_CLIENT_READY" web/service-worker.js
          grep -Fq "precacheShellAtomic" web/service-worker.js
          grep -Fq "sleepmate-release-version" build/windows/SleepMate.spec
          grep -Fq "sleepmate-build-id" build/windows/SleepMate.spec
          grep -Fq "const ASSET_VERSION=" cpap/v530_features.py
          grep -Fq '/o2ring.js?v=${ASSET_VERSION}' cpap/v530_features.py
          grep -Fq "# SleepMate ${VERSION}" RELEASE_NOTES.md
          grep -Fq "Release build: **${VERSION}**." RELEASE_NOTES.md
          echo "Release source: $TARGET_SHA"

      - name: Build and fully verify exact release source
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" --jq '.commit.sha')"
          [[ "$ACTUAL" == "$TARGET_SHA" ]] || { echo "Release source moved: $ACTUAL" >&2; exit 1; }

          gh workflow run windows-release.yml --ref "$SOURCE_BRANCH"
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID="$(gh run list --workflow windows-release.yml --branch "$SOURCE_BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n1)"
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo 'Dispatched verification run was not found.' >&2; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status

      - name: Download VERIFIED release artifact
        shell: bash
        env:
          RUN_ID: ${{ steps.verify.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf release-staging
          mkdir -p release-staging
          gh run download "$RUN_ID" --name SleepMate-Windows-x64-VERIFIED-RELEASE --dir release-staging
          cd release-staging
          sha256sum -c SHA256SUMS.txt
          test -s "SleepMate_Setup_v${VERSION}.msi"
          test -s "SleepMate_Setup_v${VERSION}.msi.sha256"
          test -s "SleepMate_v${VERSION}_windows_x64.zip"
          test -s sleepmate-update.json
          test -s release-metadata.json

      - name: Create, verify and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TITLE="SleepMate ${VERSION} — PWA és Oximetria stabilitás"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish >/tmp/existing.json 2>/dev/null; then
            DRAFT="$(jq -r '.isDraft' /tmp/existing.json)"
            TARGET="$(jq -r '.targetCommitish' /tmp/existing.json)"
            [[ "$TARGET" == "$TARGET_SHA" ]] || { echo "Existing $TAG targets $TARGET, expected $TARGET_SHA" >&2; exit 1; }
            if [[ "$DRAFT" == 'false' ]]; then
              echo "$TAG is already published from the expected commit."
              exit 0
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "release-notes/v${VERSION}.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "$TITLE" --notes-file "release-notes/v${VERSION}.md" --draft
          fi

          gh release upload "$TAG" release-staging/* --repo "$GITHUB_REPOSITORY" --clobber

          mapfile -t actual < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          expected=(
            SHA256SUMS.txt
            "SleepMate_Setup_v${VERSION}.msi"
            "SleepMate_Setup_v${VERSION}.msi.sha256"
            "SleepMate_v${VERSION}_windows_x64.zip"
            build-msi-toolchain.txt
            msi-inventory.txt
            release-metadata.json
            sleepmate-update.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]] || {
            echo 'Release asset set mismatch.' >&2
            printf 'actual: %s\n' "${actual[*]}" >&2
            printf 'expected: %s\n' "${expected_sorted[*]}" >&2
            exit 1
          }

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName,targetCommitish,url > /tmp/published.json
          [[ "$(jq -r '.isDraft' /tmp/published.json)" == 'false' ]]
          [[ "$(jq -r '.isPrerelease' /tmp/published.json)" == 'false' ]]
          [[ "$(jq -r '.tagName' /tmp/published.json)" == "$TAG" ]]
          [[ "$(jq -r '.targetCommitish' /tmp/published.json)" == "$TARGET_SHA" ]]
          cat /tmp/published.json

      - name: Advance stable and next fixes branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin
          git push origin "$TARGET_SHA:refs/heads/v5.3.5-stable-base"
          if gh api "repos/$GITHUB_REPOSITORY/branches/v5.3.17-fixes" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/v5.3.17-fixes" -f sha="$TARGET_SHA" -F force=false >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref='refs/heads/v5.3.17-fixes' -f sha="$TARGET_SHA" >/dev/null
          fi
