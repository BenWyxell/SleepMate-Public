name: Apply v5.3.4 packaging guard

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor
    paths:
      - scripts/apply_v534_packaging_guard.py
      - .github/workflows/v534-apply-packaging-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.4-o2-full-refactor
          fetch-depth: 0
      - name: Migrate Windows packaging guard
        run: python scripts/apply_v534_packaging_guard.py
      - name: Validate spec compiles as Python source
        run: python -m py_compile build/windows/SleepMate.spec
      - name: Commit migrated guard and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_v534_packaging_guard.py .github/workflows/v534-apply-packaging-guard.yml
          git add build/windows/SleepMate.spec
          git commit -m 'Protect active v5.3.4 O2 assets in Windows packaging'
          git push origin HEAD:v5.3.4-o2-full-refactor
