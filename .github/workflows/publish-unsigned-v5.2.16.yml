name: Publish v5.2.16 unsigned MSI candidate

on:
  workflow_run:
    workflows:
      - Windows build + MSI - unsigned CI only
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: sleepmate-unsigned-v5.2.16-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exactly the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify one-time release target
        id: release_target
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')"
          TAG="v${VERSION}"
          TESTED_SHA="${{ github.event.workflow_run.head_sha }}"

          if [[ "$VERSION" != "5.2.16" ]]; then
            echo "This one-time workflow is pinned to SleepMate 5.2.16, got $VERSION." >&2
            exit 1
          fi

          git fetch origin main --tags --force
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "$CURRENT_MAIN" != "$TESTED_SHA" ]]; then
            echo "A newer main commit exists; refusing to publish a stale tested artifact."
            echo "tested=$TESTED_SHA current_main=$CURRENT_MAIN"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        if: steps.release_target.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_target.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; publication will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the exact smoke-tested release artifact
        if: steps.release_target.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-UNSIGNED-CI
          path: release-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and stage release files
        if: steps.release_target.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release_target.outputs.version }}
        run: |
          set -euo pipefail

          find_one() {
            local pattern="$1"
            mapfile -t found < <(find release-input -type f -name "$pattern" -print | sort)
            if [[ "${#found[@]}" -ne 1 ]]; then
              echo "Expected exactly one file matching $pattern, found ${#found[@]}." >&2
              printf '%s\n' "${found[@]:-}"
              exit 1
            fi
            printf '%s' "${found[0]}"
          }

          MSI="$(find_one "SleepMate_Setup_v${VERSION}.msi")"
          MSI_SHA="$(find_one "SleepMate_Setup_v${VERSION}.msi.sha256")"
          PORTABLE="$(find_one "SleepMate_v${VERSION}_windows_x64.zip")"
          MANIFEST="$(find_one "sleepmate-update.json")"
          INVENTORY="$(find_one "msi-inventory.txt")"
          TOOLCHAIN="$(find_one "build-msi-toolchain.txt")"

          EXPECTED_MSI_SHA="$(awk '{print $1; exit}' "$MSI_SHA")"
          ACTUAL_MSI_SHA="$(sha256sum "$MSI" | awk '{print $1}')"
          if [[ -z "$EXPECTED_MSI_SHA" || "$EXPECTED_MSI_SHA" != "$ACTUAL_MSI_SHA" ]]; then
            echo "MSI checksum verification failed." >&2
            echo "expected=$EXPECTED_MSI_SHA actual=$ACTUAL_MSI_SHA" >&2
            exit 1
          fi

          mkdir -p release-staging
          cp "$MSI" release-staging/
          cp "$MSI_SHA" release-staging/
          cp "$PORTABLE" release-staging/
          cp "$MANIFEST" release-staging/
          cp "$INVENTORY" release-staging/
          cp "$TOOLCHAIN" release-staging/

          (
            cd release-staging
            sha256sum \
              "SleepMate_Setup_v${VERSION}.msi" \
              "SleepMate_v${VERSION}_windows_x64.zip" \
              sleepmate-update.json \
              msi-inventory.txt \
              build-msi-toolchain.txt \
              > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          # SleepMate ${VERSION} — unsigned MSI candidate

          ## Magyar

          Ez a SleepMate első nyilvános, MSI-alapú Windows kiadási formája. A csomag szándékosan **nincs még Authenticode-dal aláírva**: ezt a kiadást azért publikáljuk, hogy a SignPath Foundation jelentkezés előtt a projekt már ugyanabban az MSI-alapú formában legyen nyilvánosan elérhető, amelyet később alá szeretnénk írni.

          A Windows ezért jelenleg SmartScreen vagy vírusvédelmi figyelmeztetést jeleníthet meg. Ez a kiadás nem állítja, hogy aláírt vagy megbízható kiadói tanúsítvánnyal rendelkezik.

          A fájlok kizárólag GitHub-hosted runnereken készültek a `${{ github.event.workflow_run.head_sha }}` commitból. A publikálás előtt sikeresen lefutott:

          - public-source hygiene gate;
          - SleepMate integration/version contract;
          - Windows x64 program-tree build;
          - determinisztikus MSI build `wixl` használatával;
          - MSI payload inspection;
          - `msiexec` telepítési teszt;
          - a telepített SleepMate runtime/API smoke tesztje;
          - `msiexec` eltávolítási teszt, a felhasználói állapot megőrzésének ellenőrzésével.

          A `SHA256SUMS.txt` a publikált fő artifactok ellenőrzőösszegeit tartalmazza. Az `msi-inventory.txt` az MSI csomag tartalmának ellenőrzött listája, a `build-msi-toolchain.txt` pedig az MSI buildhez használt Ubuntu csomagverziókat rögzíti.

          **Fontos:** a SleepMate nem orvosi diagnosztikai szoftver, és nem helyettesíti az orvosi értékelést.

          ## English

          This is the first public MSI-based Windows release form of SleepMate. The package is intentionally **not Authenticode-signed yet**. It is published so that, before the SignPath Foundation application, the project already has a public release in the same MSI-based form that is intended to be signed later.

          Windows may therefore show SmartScreen or antivirus reputation warnings. This release does not claim to carry a trusted publisher signature.

          The files were produced exclusively on GitHub-hosted runners from commit `${{ github.event.workflow_run.head_sha }}`. Before publication, the following completed successfully:

          - public-source hygiene gate;
          - SleepMate integration/version contract;
          - Windows x64 program-tree build;
          - deterministic MSI build with `wixl`;
          - MSI payload inspection;
          - `msiexec` installation test;
          - runtime/API smoke test of the installed SleepMate application;
          - `msiexec` uninstall test with verification that user state is preserved.

          `SHA256SUMS.txt` contains checksums for the principal published artifacts. `msi-inventory.txt` records the inspected MSI payload and `build-msi-toolchain.txt` records the Ubuntu package versions used for MSI assembly.

          **Important:** SleepMate is not medical diagnostic software and does not replace professional medical evaluation.
          EOF

          sed -i 's/^          //' release-notes.md
          ls -lah release-staging
          cat release-staging/SHA256SUMS.txt

      - name: Publish GitHub Release v5.2.16
        if: steps.release_target.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_target.outputs.tag }}
          VERSION: ${{ steps.release_target.outputs.version }}
          TESTED_SHA: ${{ steps.release_target.outputs.sha }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            release-staging/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "SleepMate ${VERSION} — unsigned MSI candidate" \
            --notes-file release-notes.md

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
