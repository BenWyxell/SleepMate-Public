name: v5.3.2 O2Ring stability pre-release CI

on:
  push:
    branches:
      - v5.3.2-o2ring-stability
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sleepmate-v532-pre-release
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact v5.3.2 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(python -c 'from cpap.version import APP_VERSION; print(APP_VERSION)')" = '5.3.2'
          test "$(python -c 'from cpap.version import API_VERSION; print(API_VERSION)')" = '19'
          test "$(python -c 'from cpap.version import BUILD_CHANNEL; print(BUILD_CHANNEL)')" = 'stable'
          test "$(head -n 1 RELEASE_NOTES_5_3_2.md)" = '# SleepMate 5.3.2'
          python scripts/verify_public_source.py
          python scripts/verify_sleepsync_integration.py
          python -m py_compile cpap/v530_features.py cpap/o2ring_v532.py cpap/o2ring_integration.py cpap/o2ring_ble.py sleepmate_main.py
          node --check web/o2ring-v532.js
          node --check web/sleepmate-v530.js
          node --check web/o2ring.js
          node --check web/o2ring-report-ui.js
          grep -Fq 'smO2FocusDual' web/o2ring-v532.js
          grep -Fq 'smStackO2Dual' web/o2ring-v532.js
          grep -Fq 'smO2OverlaySelect' web/o2ring-v532.js
          grep -Fq 'smDashboardO2V532' web/o2ring-v532.js
          grep -Fq 'smO2TrendV3' web/o2ring-v532.js
          grep -Fq 'oximetry_live' cpap/ui_preferences_v530.py
          ! grep -Fq 'o2ring-polish-core.js' cpap/v530_features.py
          ! grep -Fq 'setInterval(' web/o2ring-v532.js

  official-windows:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Dispatch official Windows verification on exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/windows-release.yml/dispatches" -f ref="$GITHUB_REF_NAME"
      - name: Wait for exact-SHA VERIFIED Windows workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            row="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" | jq -c '[.workflow_runs[] | select(.name == "Windows release + Hungarian MSI + verified publish" and .event == "workflow_dispatch" and .head_sha == env.GITHUB_SHA)] | sort_by(.created_at) | last // empty')"
            if [[ -n "$row" ]]; then
              id="$(jq -r '.id' <<<"$row")"
              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              echo "Windows run $id: $status / $conclusion"
              if [[ "$status" == completed ]]; then
                [[ "$conclusion" == success ]] || exit 1
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -Fxq 'SleepMate-Windows-x64-VERIFIED-RELEASE'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for official Windows verification.' >&2
          exit 1
