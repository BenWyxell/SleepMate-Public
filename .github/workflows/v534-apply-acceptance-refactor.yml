name: Apply v5.3.4 acceptance refactor

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor
    paths:
      - scripts/apply_v534_acceptance_refactor.py
      - .github/workflows/v534-apply-acceptance-refactor.yml

permissions:
  contents: write

concurrency:
  group: v534-acceptance-refactor-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v5.3.4-o2-full-refactor
          fetch-depth: 0
      - name: Apply authoritative source migration
        run: python scripts/apply_v534_acceptance_refactor.py
      - name: Validate migrated JavaScript and Python contracts
        run: |
          node --check web/o2ring.js
          node --check web/sleepmate-v530.js
          node --check web/first-run.js
          python -m py_compile cpap/o2ring_runtime_v534.py cpap/o2ring_stream.py
      - name: Commit migrated source and remove one-shot migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_v534_acceptance_refactor.py .github/workflows/v534-apply-acceptance-refactor.yml
          git add web/o2ring.js web/sleepmate-v530.js web/first-run.js tests/test_mobile_ai_push_v417.py tests/test_o2ring_combined_ui.py tests/test_o2ring_polish_v530.py tests/test_o2ring_v532_release_contract.py tests/test_pwa_sleep_shell_v526.py tests/test_o2ring_v534_release_contract.py
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Complete v5.3.4 O2 interaction and source ownership refactor'
          git push origin HEAD:v5.3.4-o2-full-refactor
