name: One-time fix and publish SleepMate 5.2.17

on:
  push:
    branches:
      - installer-wizard
    paths:
      - '.github/workflows/fix-release-publisher-v5217.yml'

permissions:
  contents: write
  actions: read

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: '5.2.17'
      TAG: 'v5.2.17'
      VERIFIED_SHA: '27e9e9f7cb79f282332c8054f4d5250a8eb9c57c'
      VERIFIED_RUN_ID: '33471510625'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical publisher fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/windows-release.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/tmp/existing-release.json 2>/dev/null; then':
                  'if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish >/tmp/existing-release.json 2>/dev/null; then',
              'DRAFT="$(jq -r \'.draft\' /tmp/existing-release.json)"':
                  'DRAFT="$(jq -r \'.isDraft\' /tmp/existing-release.json)"',
              'TARGET="$(jq -r \'.target_commitish\' /tmp/existing-release.json)"':
                  'TARGET="$(jq -r \'.targetCommitish\' /tmp/existing-release.json)"',
              'mapfile -t actual < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq \'.assets[].name\' | sort)':
                  'mapfile -t actual < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq \'.assets[].name\' | sort)',
              'gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > /tmp/published.json':
                  'gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish > /tmp/published.json',
              '[[ "$(jq -r \'.draft\' /tmp/published.json)" == \'false\' ]]':
                  '[[ "$(jq -r \'.isDraft\' /tmp/published.json)" == \'false\' ]]',
              '[[ "$(jq -r \'.tag_name\' /tmp/published.json)" == "$TAG" ]]':
                  '[[ "$(jq -r \'.tagName\' /tmp/published.json)" == "$TAG" ]]',
              '[[ "$(jq -r \'.target_commitish\' /tmp/published.json)" == "$GITHUB_SHA" ]]':
                  '[[ "$(jq -r \'.targetCommitish\' /tmp/published.json)" == "$GITHUB_SHA" ]]',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one publisher pattern, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -F 'gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets' .github/workflows/windows-release.yml

      - name: Export patched canonical workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-windows-release-v5217
          path: .github/workflows/windows-release.yml
          if-no-files-found: error
          retention-days: 1

      - name: Re-verify the already smoke-tested draft release
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish,assets > /tmp/draft.json
          [[ "$(jq -r '.isDraft' /tmp/draft.json)" == 'true' ]]
          [[ "$(jq -r '.tagName' /tmp/draft.json)" == "$TAG" ]]
          [[ "$(jq -r '.targetCommitish' /tmp/draft.json)" == "$VERIFIED_SHA" ]]

          mapfile -t actual < <(jq -r '.assets[].name' /tmp/draft.json | sort)
          expected=(
            SHA256SUMS.txt
            "SleepMate_Setup_v${VERSION}.msi"
            "SleepMate_Setup_v${VERSION}.msi.sha256"
            "SleepMate_v${VERSION}_windows_x64.zip"
            build-msi-toolchain.txt
            msi-inventory.txt
            release-metadata.json
            sleepmate-update.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected_sorted[@]}")" ]] || {
            printf 'Draft assets: %s\n' "${actual[*]}" >&2
            printf 'Expected: %s\n' "${expected_sorted[*]}" >&2
            exit 1
          }

          rm -rf release-check
          mkdir release-check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-check
          cd release-check
          sha256sum -c SHA256SUMS.txt
          jq -e --arg version "$VERSION" --arg sha "$VERIFIED_SHA" --arg run "$VERIFIED_RUN_ID" \
            '.version == $version and .git_commit == $sha and .workflow_run_id == $run and .signed == false' \
            release-metadata.json >/dev/null
          jq -e --arg version "$VERSION" --arg sha "$VERIFIED_SHA" \
            '.version == $version and .git_commit == $sha and .package_type == "windows-x64-program-tree"' \
            sleepmate-update.json >/dev/null
          echo 'Existing draft release fully re-verified.'

      - name: Publish verified v5.2.17 release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish,url > /tmp/published.json
          [[ "$(jq -r '.isDraft' /tmp/published.json)" == 'false' ]]
          [[ "$(jq -r '.tagName' /tmp/published.json)" == "$TAG" ]]
          [[ "$(jq -r '.targetCommitish' /tmp/published.json)" == "$VERIFIED_SHA" ]]
          echo "Published: $(jq -r '.url' /tmp/published.json)"
