name: v5.3.4 one-shot final interaction hardening

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden packaged touch, listener and trend acceptance
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_v534_final_interaction_hardening.py
          python -m py_compile scripts/v534_browser_acceptance.py
          grep -F 'def pan_canvas' scripts/v534_browser_acceptance.py
          grep -F 'daily O2 chart listeners leaked across peer-mode switching' scripts/v534_browser_acceptance.py
          grep -F 'Oximetria page chart listeners leaked across tab switching' scripts/v534_browser_acceptance.py
          grep -F "pathRecords.some(x => x.id==='o2rTrendSpo2'" scripts/v534_browser_acceptance.py
          rm scripts/_tmp_v534_final_interaction_hardening.py
          rm .github/workflows/v534-final-interaction-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v534_browser_acceptance.py scripts/_tmp_v534_final_interaction_hardening.py .github/workflows/v534-final-interaction-hardening.yml
          git diff --cached --check
          git commit -m "Harden packaged touch and listener acceptance"
          git push origin HEAD:v5.3.4-o2-full-refactor
