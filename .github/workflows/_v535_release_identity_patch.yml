name: Align v5.3.5 release identity contracts

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align only canonical release identity assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for name in ('tests/test_v534_acceptance_matrix.py', 'tests/test_o2ring_v534_release_contract.py'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              old = 'assert APP_VERSION == "5.3.4"'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one legacy APP_VERSION assertion, found {text.count(old)}')
              text = text.replace(old, 'assert APP_VERSION == "5.3.5"', 1)
              p.write_text(text, encoding='utf-8')

          p = Path('tests/test_v535_user_acceptance_matrix.py')
          text = p.read_text(encoding='utf-8')
          if 'from cpap.version import APP_VERSION' not in text:
              needle = 'from pathlib import Path\n'
              if text.count(needle) != 1:
                  raise SystemExit('Unable to place APP_VERSION import deterministically')
              text = text.replace(needle, needle + '\nfrom cpap.version import APP_VERSION\n', 1)
          if "RELEASE_NOTES = read('RELEASE_NOTES.md')" not in text:
              needle = "BROWSER = read('scripts/v534_browser_acceptance.py')\n"
              if text.count(needle) != 1:
                  raise SystemExit('Unable to place release notes fixture deterministically')
              text = text.replace(needle, needle + "RELEASE_NOTES = read('RELEASE_NOTES.md')\n", 1)
          marker = 'def test_release_identity_is_v535():'
          if marker not in text:
              text += '''\n\ndef test_release_identity_is_v535():\n    assert APP_VERSION == '5.3.5'\n    assert RELEASE_NOTES.startswith('# SleepMate 5.3.5\\n')\n    section = RELEASE_NOTES.split('\\n---\\n', 1)[0]\n    assert 'Release build: **5.3.5**.' in section\n    assert 'Kiadási csatorna: **stable**.' in section\n'''
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot helper before validation
        shell: bash
        run: rm -f .github/workflows/_v535_release_identity_patch.yml
      - name: Validate aligned contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_v534_acceptance_matrix.py \
            tests/test_o2ring_v534_release_contract.py \
            tests/test_v535_user_acceptance_matrix.py \
            tests/test_release_version_contract.py
      - name: Commit clean release identity alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v534_acceptance_matrix.py tests/test_o2ring_v534_release_contract.py tests/test_v535_user_acceptance_matrix.py .github/workflows/_v535_release_identity_patch.yml
          git diff --cached --quiet && { echo 'No release identity changes to commit.' >&2; exit 1; }
          git commit -m 'Align release identity contracts with v5.3.5'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
