name: v5.3.4 one-shot Stack O2 pointer migration

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix interactive Stack O2 canvases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_v534_stack_pointer.py
          python -m py_compile scripts/v534_browser_acceptance.py
          node --check web/o2ring.js
          grep -F "c.style.pointerEvents='auto'" web/o2ring.js
          grep -F 'Stack O2 chart input was disabled by the CPAP base-canvas CSS' scripts/v534_browser_acceptance.py
          rm scripts/_tmp_v534_stack_pointer.py
          rm .github/workflows/v534-stack-pointer-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/o2ring.js scripts/v534_browser_acceptance.py scripts/_tmp_v534_stack_pointer.py .github/workflows/v534-stack-pointer-migration.yml
          git diff --cached --check
          git commit -m "Restore pointer input on Stack O2 charts"
          git push origin HEAD:v5.3.4-o2-full-refactor
