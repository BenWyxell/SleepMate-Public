name: Apply v5.3.5 O2 stability follow-up

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/v535_stability_followup_patch.py
      - .github/workflows/v535-stability-followup-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply stability follow-up
        run: python scripts/v535_stability_followup_patch.py
      - name: Validate product and acceptance code
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py
          node --check web/o2ring.js
          node --check web/frontend-v534.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_v535_user_acceptance_matrix.py \
            tests/test_v535_polish_contract.py \
            tests/test_v534_acceptance_matrix.py \
            tests/test_v534_first_load_observer_guard.py \
            tests/test_o2ring_v534_release_contract.py
          git diff --check
      - name: Commit validated follow-up and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/v535_stability_followup_patch.py .github/workflows/v535-stability-followup-patch.yml
          git add web/o2ring.js scripts/v534_browser_acceptance.py tests/test_v535_user_acceptance_matrix.py
          git commit -m 'Harden v5.3.5 O2 lifecycle and trend behavior'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
