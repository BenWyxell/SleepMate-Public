name: Apply public updater v5.2.20

on:
  push:
    branches:
      - installer-wizard
    paths:
      - scripts/hotfix_public_updater_v5220.py
      - .github/workflows/public-updater-v5220.yml

permissions:
  contents: write

concurrency:
  group: sleepmate-public-updater-v5220
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v4
        with:
          ref: installer-wizard
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Normalize patch helper input handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/hotfix_public_updater_v5220.py')
          text=p.read_text(encoding='utf-8')
          old='return (ROOT / rel).read_bytes().decode("utf-8")'
          new='return (ROOT / rel).read_bytes().decode("utf-8").replace("\\r\\n", "\\n")'
          if old not in text:
              raise SystemExit('patch helper read() marker not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply public updater and Cloudflare provenance patch
        run: python scripts/hotfix_public_updater_v5220.py

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate Python and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app.py cpap/maintenance.py cpap/version.py scripts/verify_sleepsync_integration.py
          node --check web/app-core.js
          node --check web/app.js
          node --check web/first-run.js
          node --check web/sleepsync-hydration-v529.js
          node --check web/sleepsync-polish.js

      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_sleepsync_integration.py
          python -m pytest -q \
            tests/test_public_updater_v5220.py \
            tests/test_maintenance_v420.py \
            tests/test_v420_ui.py \
            tests/test_first_run_wizard_v5217_hotfix.py \
            tests/test_v521_sleep_analysis.py \
            tests/test_windows_packaging_v500.py \
            tests/test_update_resilience_v525.py

      - name: Keep workflow-owned files out of runner commit
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/windows-release.yml
          git checkout HEAD -- .github/workflows/public-updater-v5220.yml
          git checkout HEAD -- scripts/hotfix_public_updater_v5220.py

      - name: Commit final v5.2.20 code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'feat(update): use official public releases without GitHub token'
          git push origin HEAD:installer-wizard
