name: Apply missing behavioral acceptance coverage

on:
  push:
    branches:
      - v5.3.5-o2-dashboard-polish
    paths:
      - scripts/acceptance_behavior_patch.py
      - .github/workflows/acceptance-behavior-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5.3.5-o2-dashboard-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply behavior coverage patch
        run: python scripts/acceptance_behavior_patch.py
      - name: Remove one-shot helpers before acceptance
        run: git rm scripts/acceptance_behavior_patch.py .github/workflows/acceptance-behavior-patch.yml
      - name: Validate strict source and acceptance contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/v534_browser_acceptance.py scripts/v534_browser_acceptance_runner.py
          node --check web/o2ring.js
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_v535_polish_contract.py \
            tests/test_v535_user_acceptance_matrix.py \
            tests/test_v534_acceptance_matrix.py \
            tests/test_v534_packaging_acceptance.py \
            tests/test_v534_first_load_observer_guard.py \
            tests/test_o2ring_v534_release_contract.py
          git diff --check
      - name: Commit validated behavior coverage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/v534_browser_acceptance.py
          git commit -m 'Add missing v5.3.5 behavioral acceptance coverage'
          git push origin HEAD:v5.3.5-o2-dashboard-polish
