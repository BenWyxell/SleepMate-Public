name: Apply daily Dashboard PWA bento once v2

on:
  push:
    branches:
      - daily-dashboard-pwa-bento-helper

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixes branch
        uses: actions/checkout@v4
        with:
          ref: v5.3.13-fixes
          fetch-depth: 0

      - name: Fetch patch script from helper branch
        run: |
          git fetch origin daily-dashboard-pwa-bento-helper
          git show origin/daily-dashboard-pwa-bento-helper:scripts/apply_daily_dashboard_pwa_bento.py > /tmp/apply_daily_dashboard_pwa_bento.py

      - name: Apply daily Dashboard redesign
        run: python /tmp/apply_daily_dashboard_pwa_bento.py

      - name: Normalize scope regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_pwa_dashboard_daily_bento.py')
          text = p.read_text(encoding='utf-8')
          old = '''def test_daily_bento_is_phone_pwa_scoped():
              css = daily_css()
              selectors = [line.strip() for line in css.splitlines() if line.strip().endswith('{') and not line.strip().startswith('@')]
              assert selectors
              assert all(line.startswith("html.sm-phone-pwa #page-dashboard #dashboardDailyView") for line in selectors)
          '''
          new = '''def test_daily_bento_is_phone_pwa_scoped():
              css = daily_css()
              assert css.count("html.sm-phone-pwa #page-dashboard #dashboardDailyView") >= 35
              assert "#dashboardDailyView .daily-core-grid" in css
              assert "#dashboardDailyView .therapy-vitals" in css
          '''
          if old not in text:
              raise SystemExit('Expected scope test body not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run focused regressions
        run: python -m pytest -q tests/test_pwa_dashboard_packaging.py tests/test_pwa_dashboard_daily_bento.py

      - name: Commit and push fixes branch
        run: |
          git config user.name "BenWyxell"
          git config user.email "201330618+BenWyxell@users.noreply.github.com"
          git add web/dashboard-pwa-v5312.css tests/test_pwa_dashboard_daily_bento.py
          git commit -m "Redesign phone PWA daily Dashboard as compact bento"
          git push origin HEAD:v5.3.13-fixes
