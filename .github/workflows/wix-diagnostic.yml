name: WiX MSI diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - installer-wizard

permissions:
  contents: read
  actions: read

concurrency:
  group: sleepmate-wix-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wix-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download known-good Windows program tree
        uses: actions/download-artifact@v4
        with:
          name: SleepMate-Windows-x64-PROGRAM-TREE
          path: ci-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: BenWyxell/SleepMate-Public
          run-id: 33452976632

      - name: Install pinned WiX Toolset 3.14.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wixtoolset --version 3.14.1.20250415 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "WiX Toolset installation failed: $LASTEXITCODE" }

          $wixRoot = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3*' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $wixRoot) { throw 'WiX Toolset installation directory was not found.' }
          $candle = Join-Path $wixRoot.FullName 'bin\candle.exe'
          $light = Join-Path $wixRoot.FullName 'bin\light.exe'
          if (-not (Test-Path $candle) -or -not (Test-Path $light)) {
            throw 'candle.exe/light.exe were not found after WiX installation.'
          }
          "WIX_CANDLE=$candle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIX_LIGHT=$light" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate MSI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          New-Item -ItemType Directory -Force -Path 'build\windows\msi','release','wix-diagnostics' | Out-Null
          python .\scripts\generate_msi_wxs.py `
            --source-dir .\ci-input\dist\SleepMate `
            --output .\build\windows\msi\SleepMate.generated.wxs `
            --version $version

      - name: Run candle and light with persistent logs
        id: wix
        shell: powershell
        continue-on-error: true
        run: |
          $version = (& python -c "from cpap.version import APP_VERSION; print(APP_VERSION)").Trim()
          $wixObj = 'build\windows\msi\SleepMate.generated.wixobj'
          $msi = "release\SleepMate_Setup_v${version}.msi"
          $candleLog = 'wix-diagnostics\candle.log'
          $lightLog = 'wix-diagnostics\light.log'

          "COMMAND: $env:WIX_CANDLE -nologo -arch x64 -out $wixObj build\windows\msi\SleepMate.generated.wxs" | Set-Content $candleLog -Encoding utf8
          & $env:WIX_CANDLE -nologo -arch x64 -out $wixObj 'build\windows\msi\SleepMate.generated.wxs' 2>&1 |
            Tee-Object -FilePath $candleLog -Append | ForEach-Object { Write-Host $_ }
          $candleExit = $LASTEXITCODE
          "CANDLE_EXIT=$candleExit" | Add-Content $candleLog
          if ($candleExit -ne 0) {
            "FAILED_STAGE=candle" | Set-Content 'wix-diagnostics\result.txt'
            "EXIT_CODE=$candleExit" | Add-Content 'wix-diagnostics\result.txt'
            exit $candleExit
          }

          "COMMAND: $env:WIX_LIGHT -nologo -ext WixUIExtension -cultures:hu-HU -loc build\windows\msi\SleepMate.hu-HU.wxl -out $msi $wixObj" | Set-Content $lightLog -Encoding utf8
          & $env:WIX_LIGHT -nologo -ext WixUIExtension -cultures:hu-HU `
            -loc 'build\windows\msi\SleepMate.hu-HU.wxl' `
            -out $msi $wixObj 2>&1 |
            Tee-Object -FilePath $lightLog -Append | ForEach-Object { Write-Host $_ }
          $lightExit = $LASTEXITCODE
          "LIGHT_EXIT=$lightExit" | Add-Content $lightLog
          if ($lightExit -ne 0) {
            "FAILED_STAGE=light" | Set-Content 'wix-diagnostics\result.txt'
            "EXIT_CODE=$lightExit" | Add-Content 'wix-diagnostics\result.txt'
            exit $lightExit
          }

          'FAILED_STAGE=none' | Set-Content 'wix-diagnostics\result.txt'
          'EXIT_CODE=0' | Add-Content 'wix-diagnostics\result.txt'

      - name: Upload WiX diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-WiX-DIAGNOSTICS
          path: |
            wix-diagnostics/**
            build/windows/msi/SleepMate.generated.wxs
            build/windows/msi/SleepMate-Legal.rtf
            build/windows/msi/SleepMate.hu-HU.wxl
            release/SleepMate_Setup_v*.msi
          if-no-files-found: warn
          retention-days: 1

      - name: Fail job when WiX failed
        if: steps.wix.outcome == 'failure'
        shell: powershell
        run: |
          if (Test-Path 'wix-diagnostics\result.txt') { Get-Content 'wix-diagnostics\result.txt' | Write-Host }
          if (Test-Path 'wix-diagnostics\candle.log') { Get-Content 'wix-diagnostics\candle.log' | Select-Object -Last 100 | Write-Host }
          if (Test-Path 'wix-diagnostics\light.log') { Get-Content 'wix-diagnostics\light.log' | Select-Object -Last 100 | Write-Host }
          throw 'WiX diagnostic build failed; logs were uploaded as an artifact.'
