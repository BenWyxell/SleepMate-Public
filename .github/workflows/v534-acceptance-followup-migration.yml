name: v5.3.4 one-shot acceptance follow-up migration

on:
  push:
    branches:
      - v5.3.4-o2-full-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply packaged report and gap acceptance patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_tmp_v534_acceptance_followup.py
          python -m py_compile scripts/v534_browser_acceptance.py
          grep -F "daily SpO2 line crossed a long no-data gap" scripts/v534_browser_acceptance.py
          grep -F "Reports O2 columns hydrate and refresh after SleepSync invalidation" scripts/v534_browser_acceptance.py
          rm scripts/_tmp_v534_acceptance_followup.py
          rm .github/workflows/v534-acceptance-followup-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v534_browser_acceptance.py scripts/_tmp_v534_acceptance_followup.py .github/workflows/v534-acceptance-followup-migration.yml
          git diff --cached --check
          git commit -m "Exercise report refresh and O2 gap handling in packaged Edge"
          git push origin HEAD:v5.3.4-o2-full-refactor
